# Build and test HCFCore.
#
# Compiles the plugin against the real Paper API, runs the unit tests and builds
# the shaded jar, on every push to main and every pull request. A red build here
# means a genuine mismatch with Paper 26.2 or a failing rule, not a flaky runner:
# the tests need no server and no external service.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running the build by hand, e.g. after a Paper version bump.
  workflow_dispatch:

# Only the latest run per branch matters; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The three actions below sit at their own latest major, which is why the
      # numbers differ: checkout v7, setup-java v6, upload-artifact v7 (checked
      # against the actions' own release notes on 12/09/2026). Every major since
      # v4 is a runtime bump to Node 24, needing a runner of 2.327.1 or newer -
      # GitHub-hosted ubuntu-latest is well past that. The only behavioural
      # change that touches a workflow is checkout v7 refusing to check out a
      # fork's head for pull_request_target and workflow_run; this workflow uses
      # plain pull_request, so it is unaffected.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Paper 26.2 requires JDK 25 (CONTRIBUTING.md section 2). Installing it here also
      # means Gradle's toolchain resolution finds it locally and never needs to
      # reach api.foojay.io to auto-provision one.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Runs compileJava, the unit tests and shadowJar (build depends on it,
      # see build.gradle.kts), so a relocation or packaging break also shows up.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      # The failure message alone rarely says which assertion broke; the HTML and
      # XML reports do.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload built plugin jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hcfcore-jar
          path: build/libs/*.jar
          retention-days: 7
          if-no-files-found: warn
