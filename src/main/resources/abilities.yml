# --8<-- [start:pocket-bard-items]
# The Pocket Bard's sets. A pick gives "amount" items; right-clicking one gives
# its effect to the teammates within "radius" - and the user, with include-self -
# then that set waits "cooldown-seconds" before its next use, and every item
# waits for and starts the shared cooldown (global.cooldown-seconds).
pocket-bard:
  menu-title: "&dPocket Bard Selection"
  menu-size: 9
  items:
    strength:
      material: BLAZE_POWDER
      name: "&6Strength II"
      lore: ["&7* &aTeam Members"]
      amount: 3
      effect: {effect: strength, level: 2, seconds: 6}
      radius: 20
      include-self: true
      slot: 1
      menu-name: "&c3x Strength"
      cooldown-seconds: 60
    resistance:
      material: IRON_INGOT
      name: "&6Resistance III"
      lore: ["&7* &aTeam Members"]
      amount: 3
      effect: {effect: resistance, level: 3, seconds: 6}
      radius: 20
      include-self: true
      slot: 2
      menu-name: "&73x Resistance"
      cooldown-seconds: 60
    jump-boost:
      material: FEATHER
      name: "&6Jump VII"
      lore: ["&7* &aTeam Members"]
      amount: 3
      effect: {effect: jump_boost, level: 7, seconds: 6}
      radius: 20
      include-self: true
      slot: 3
      menu-name: "&a3x Jump"
      cooldown-seconds: 60
    speed:
      material: SUGAR
      name: "&6Speed III"
      lore: ["&7* &aTeam Members"]
      amount: 3
      effect: {effect: speed, level: 3, seconds: 6}
      radius: 20
      include-self: true
      slot: 4
      menu-name: "&b3x Speed"
      cooldown-seconds: 60
# --8<-- [end:pocket-bard-items]
