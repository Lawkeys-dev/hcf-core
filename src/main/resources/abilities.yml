# ---------------------------------------------------------------------------
# abilities.yml - partner items
#
# An ability is an item that does something when it is used: right-clicked,
# thrown, hit with, or shot from. What it does is its "type" - built into the
# plugin - and every value it reads is here. A "commands" ability runs console
# commands instead, for anything the types do not cover.
#
#   /ability                             the abilities, and your cooldowns
#   /ability give <player> <id> [amount]  hand one out (hcfcore.ability.admin);
#                                         from the console too - a killstreak, a
#                                         redeem code, a store
#
# Every ability reads:
#   type               what it does (the list is in the documentation)
#   material           the item
#   name, lore         shown on it; colour codes allowed
#   glow               shines as an enchanted item does (default true)
#   enchantments       on the item itself, e.g. {infinity: 1}
#   cooldown-seconds   wait before this ability can be used again
#   consume            take one from the stack when used (default true)
#   enabled            false leaves it out (default true)
#
# An effect is {effect: strength, level: 2, seconds: 8} - level 1 is level I.
#
# /hcf reload applies changes at once. An item handed out keeps working as long
# as its id is still here: rename an id and the items carrying the old one stop.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:global]
global:
  enabled: true
  # A wait after using any ability before the next one, whichever it is.
  cooldown-seconds: 10
  # An ability that takes several hits (hits-required) counts them on the same
  # player, this many seconds apart at most; longer, and the count starts over.
  hits-within-seconds: 10
  # The title of /ability's menu.
  menu-title: "&dAbilities"
  # Where no ability works: a Citadel's claim, the zone of a running event
  # (KOTH, Citadel, Conquest), the Nether, the End, the warzone.
  disabled-in:
    citadel: true
    events: true
    nether: true
    end: true
    warzone: false
# --8<-- [end:global]

abilities:
  # --8<-- [start:switcher]
  # Throw it at a player to switch places with them, 8 blocks away at most.
  switcher:
    type: switcher
    material: SNOWBALL          # SNOWBALL or EGG: it is thrown
    name: "&b&lSwitcher"
    lore:
      - "&7Throw this snowball at a player to switch"
      - "&7positions with them, max range of 8 blocks."
    cooldown-seconds: 30
    distance: 8
  # --8<-- [end:switcher]

  # --8<-- [start:thunderbolt]
  # For 10 seconds, each hit has a 20% chance to strike lightning, for 1.5
  # hearts through armour.
  thunderbolt:
    type: thunderbolt
    material: GOLD_INGOT
    name: "&e&lThunderbolt"
    lore:
      - "&7Right click this item and for the next"
      - "&710 seconds you have a chance to strike"
      - "&7your opponent with lightning dealing -1.5"
    cooldown-seconds: 120
    seconds: 10
    chance: 20
    damage-hearts: 1.5
  # --8<-- [end:thunderbolt]

  # --8<-- [start:combo]
  # For 10 seconds your hits are counted (12 at most); then Strength II for a
  # second per hit.
  combo:
    type: combo
    material: BOWL
    name: "&3&lCombo Ability"
    lore:
      - "&7Right click this item and for the next 10 seconds"
      - "&7each hit you get will give you a second of strength"
    cooldown-seconds: 120
    seconds: 10
    max-hits: 12
    seconds-per-hit: 1
    effect: {effect: strength, level: 2}
  # --8<-- [end:combo]

  # --8<-- [start:lucky-mode]
  # For 10 seconds, each hit deals from 10% less to 35% more, at random.
  lucky-mode:
    type: lucky-mode
    material: YELLOW_DYE
    name: "&a&lLucky Mode"
    lore:
      - "&7Right click this item and for the"
      - "&7next 10 seconds you will be given a damage"
      - "&7change from -10% to 35% extra damage."
    cooldown-seconds: 120
    seconds: 10
    min-percent: -10
    max-percent: 35
  # --8<-- [end:lucky-mode]

  # --8<-- [start:rage-ball]
  # Throw it: where it lands, within 8 blocks, teammates get Strength II and
  # Resistance III, enemies Wither II. Its cooldown starts for the whole team.
  rage-ball:
    type: rage-ball
    material: EGG               # SNOWBALL or EGG: it is thrown
    name: "&c&lRage Ball"
    lore:
      - "&7Throw this and when it lands every player"
      - "&7in a radius of 8 blocks will be given effects:"
      - "&7Teammates: Strength 2, Resistance 3"
      - "&7Enemies: Wither 2"
    cooldown-seconds: 120
    radius: 8
    cooldown-whole-team: true
    team-effects:
      - {effect: strength, level: 2, seconds: 8}
      - {effect: resistance, level: 3, seconds: 8}
    enemy-effects:
      - {effect: wither, level: 2, seconds: 8}
  # --8<-- [end:rage-ball]

  # --8<-- [start:crafting-chaos]
  # Hit a player 3 times with it: for 10 seconds, each of your hits has a 20%
  # chance to open a crafting table on them.
  crafting-chaos:
    type: crafting-chaos
    material: CRAFTING_TABLE
    name: "&6&lCrafting Chaos"
    lore:
      - "&7Hit a player with this item and have"
      - "&7a chance of putting them in a"
      - "&7crafting table when you hit them."
    cooldown-seconds: 120
    hits-required: 3
    chance: 20
    seconds: 10
  # --8<-- [end:crafting-chaos]

  # --8<-- [start:focus-mode]
  # The last player who hit you (in the last 15 seconds) takes 25% more damage
  # from you for 10 seconds.
  focus-mode:
    type: focus-mode
    material: GOLD_NUGGET
    name: "&9&lFocus Mode"
    lore:
      - "&7Right click this item and the last person"
      - "&7who hit you will take 25% more damage."
    cooldown-seconds: 120
    damage-multiplier: 1.25
    seconds: 10
    hit-within-seconds: 15
  # --8<-- [end:focus-mode]

  # --8<-- [start:ninja]
  # Teleports you, 3 seconds later, to the last player you hit (in the last 10
  # seconds).
  ninja:
    type: ninja
    material: NETHER_STAR
    name: "&8&lNinja Ability"
    lore:
      - "&7Right click this item to teleport to"
      - "&7the last person you hit in 3s."
    cooldown-seconds: 120
    delay-seconds: 3
    hit-within-seconds: 10
  # --8<-- [end:ninja]

  # --8<-- [start:portable-archer]
  # A bow whose arrows archer-tag the player they hit for 10 seconds; it breaks
  # after 5 shots.
  portable-archer:
    type: portable-archer
    material: BOW
    name: "&2&lPortable Archer"
    lore:
      - "&7Shoot someone with this bow"
      - "&7to archer tag them for 10s."
    enchantments: {infinity: 1}
    cooldown-seconds: 60
    uses: 5
    tag-seconds: 10
    damage-multiplier: 1.15
  # --8<-- [end:portable-archer]

  # --8<-- [start:invisibility]
  # Invisible for 2 minutes - armour hidden too - until a player hits you.
  invisibility:
    type: invisibility
    material: INK_SAC
    name: "&7&lInvisibility"
    lore:
      - "&7Right click this item and you will be"
      - "&7turned invisible even with armor on."
    cooldown-seconds: 120
    effect: {effect: invisibility, level: 2, seconds: 120}
    hide-armor: true
    reveal-on-hit: true
  # --8<-- [end:invisibility]

  # --8<-- [start:time-warp]
  # Back, 2 seconds later, to where you threw your last ender pearl (in the
  # last 15 seconds).
  time-warp:
    type: time-warp
    material: FEATHER
    name: "&5&lTime Warp"
    lore:
      - "&7Right click this item to teleport to"
      - "&7your last pearl location in 2 seconds."
    cooldown-seconds: 90
    pearl-within-seconds: 15
    delay-seconds: 2
  # --8<-- [end:time-warp]

  # --8<-- [start:pocket-bard]
  # Opens a menu to pick a set of Bard items (pocket-bard, below). Nothing is
  # spent until one is picked. No cooldown of its own, and none shared: the items
  # it gives have theirs.
  pocket-bard:
    type: pocket-bard
    material: ORANGE_DYE
    name: "&6&lPocket Bard"
    lore:
      - "&7Right click this item to open the"
      - "&7portable bard selection."
  # --8<-- [end:pocket-bard]

  # --8<-- [start:berserk]
  # Strength II, Resistance III and Regeneration III for 8 seconds - and no
  # healing potion for those 8 seconds.
  berserk:
    type: berserk
    material: RED_DYE
    name: "&4&lBerserk"
    lore:
      - "&7Right click this item to receive godly"
      - "&7effects but you are unable to pot for 8s"
    cooldown-seconds: 180
    seconds: 8
    effects:
      - {effect: strength, level: 2, seconds: 8}
      - {effect: resistance, level: 3, seconds: 8}
      - {effect: regeneration, level: 3, seconds: 8}
    # Potions refused meanwhile, drunk or thrown: strong_healing is Healing II.
    denied-potions: [strong_healing]
  # --8<-- [end:berserk]

  # --8<-- [start:close-call]
  # Strength II and Regeneration V for 6 seconds - only at 3.5 hearts or less.
  close-call:
    type: close-call
    material: COOKIE
    name: "&d&lClose Call"
    lore:
      - "&7Right click this item to receive godly"
      - "&7effects when you are lower than 3.5 hearts."
    cooldown-seconds: 120
    max-health-hearts: 3.5
    effects:
      - {effect: strength, level: 2, seconds: 6}
      - {effect: regeneration, level: 5, seconds: 6}
  # --8<-- [end:close-call]

  # --8<-- [start:switch-stick]
  # For 10 seconds, each hit has a 20% chance to turn the player hit around.
  switch-stick:
    type: switch-stick
    material: STICK
    name: "&e&lSwitch Stick"
    lore:
      - "&7Right click this item to start a 10 second"
      - "&7period where you are able to turn around the"
      - "&7player you are attacking."
    cooldown-seconds: 120
    seconds: 10
    chance: 20
    degrees: 180
  # --8<-- [end:switch-stick]

  # --8<-- [start:belch-bomb]
  # Slowness II and Blindness II for 6 seconds, for every enemy within 8 blocks.
  belch-bomb:
    type: belch-bomb
    material: SLIME_BALL
    name: "&2&lBelch Bomb"
    lore:
      - "&7Right click this item to give all enemies in a"
      - "&7radius of 8 blocks slowness and blindness."
    cooldown-seconds: 120
    radius: 8
    effects:
      - {effect: slowness, level: 2, seconds: 6}
      - {effect: blindness, level: 2, seconds: 6}
  # --8<-- [end:belch-bomb]

  # --8<-- [start:anti-trap-star]
  # Teleports you, 3 seconds later, to the last player who hit you (in the last
  # 10 seconds) - out of a trap, onto the one who put you there.
  anti-trap-star:
    type: anti-trap-star
    material: NETHER_STAR
    name: "&f&lAnti Trap Star"
    lore:
      - "&7Right click this item to teleport to the last"
      - "&7person who hit you in 3s."
    cooldown-seconds: 120
    delay-seconds: 3
    hit-within-seconds: 10
  # --8<-- [end:anti-trap-star]

  # --8<-- [start:rose-thorn]
  # Hit a player with it: for 10 seconds, 30% of the damage they deal you goes
  # back to them, through armour.
  rose-thorn:
    type: thorns
    material: ROSE_BUSH
    name: "&c&lRose Thorn"
    lore:
      - "&7Hit a player with this item: for 10 seconds,"
      - "&730% of the damage they deal you goes back to them."
    cooldown-seconds: 120
    seconds: 10
    reflect-percent: 30
  # --8<-- [end:rose-thorn]

  # --8<-- [start:pumpkin-reaper]
  # Hit a Diamond with it: a 50% chance their helmet is swapped for a pumpkin,
  # which cannot be taken off, for 10 seconds. The helmet comes back after -
  # and drops as itself if they die meanwhile.
  pumpkin-reaper:
    type: pumpkin
    material: CARVED_PUMPKIN
    name: "&c&lPumpkin Reaper"
    lore:
      - "&7Hit a Diamond with this item: 50% chance"
      - "&7their helmet becomes a pumpkin for 10 seconds."
    cooldown-seconds: 30
    chance: 50
    seconds: 10
    classes: [diamond]         # the classes it works on; [] for anybody
  # --8<-- [end:pumpkin-reaper]

  # --8<-- [start:strength-bard]
  # Strength II for 5 seconds, for you and your teammates within 20 blocks.
  strength-bard:
    type: team-effects
    material: BLAZE_POWDER
    name: "&6&lStrength II"
    lore:
      - "&7Right click to give Strength II to you and"
      - "&7your teammates within 20 blocks for 5 seconds."
    cooldown-seconds: 60
    radius: 20
    include-self: true
    effects:
      - {effect: strength, level: 2, seconds: 5}
  # --8<-- [end:strength-bard]

  # --8<-- [start:hulk-smash]
  # Every enemy within 10 blocks is thrown about 6 blocks in the air.
  hulk-smash:
    type: hulk-smash
    material: PISTON
    name: "&2&lHulk Smash"
    lore:
      - "&7Right click to throw every enemy within"
      - "&710 blocks in the air."
    cooldown-seconds: 30
    radius: 10
    height: 2                  # 1 is about 3 blocks
    push: 0.3                  # how far away from you, as well as up
  # --8<-- [end:hulk-smash]

  # --8<-- [start:sticky-web]
  # No fall damage for 10 seconds.
  sticky-web:
    type: no-fall
    material: COBWEB
    name: "&f&lSticky Web"
    lore:
      - "&7Right click: no fall damage for 10 seconds."
    cooldown-seconds: 30
    seconds: 10
  # --8<-- [end:sticky-web]

  # --8<-- [start:med-kit]
  # Regeneration III and Absorption V for 10 seconds.
  med-kit:
    type: effects
    material: GLISTERING_MELON_SLICE
    name: "&c&lMed Kit"
    lore:
      - "&7Right click to receive Regeneration III"
      - "&7and Absorption V for 10 seconds."
    cooldown-seconds: 120
    effects:
      - {effect: regeneration, level: 3, seconds: 10}
      - {effect: absorption, level: 5, seconds: 10}
  # --8<-- [end:med-kit]

  # --8<-- [start:grappling-hook]
  # Cast it at a block and reel in: you fly to the hook. No fall damage while
  # it is in hand. It never breaks, and stays.
  grappling-hook:
    type: grappling-hook
    material: FISHING_ROD      # a grappling-hook is a FISHING_ROD
    name: "&6&lGrappling Hook"
    lore:
      - "&7Cast at a block and reel in to fly to it."
      - "&7No fall damage while in hand."
    cooldown-seconds: 15
    consume: false
    pull: 1.0                  # stronger above 1, weaker below
    max-speed: 4.0             # the fastest it carries you, in blocks a tick
    no-fall-while-held: true
  # --8<-- [end:grappling-hook]

  # --8<-- [start:nausea-axe]
  # Hit a player with it: a 50% chance of Nausea for 10 seconds.
  nausea-axe:
    type: hit-effects
    material: IRON_AXE
    name: "&e&lNausea Axe"
    lore:
      - "&7Hit a player with this item: 50% chance"
      - "&7to give them Nausea for 10 seconds."
    cooldown-seconds: 45
    chance: 50
    effects:
      - {effect: nausea, level: 1, seconds: 10}
  # --8<-- [end:nausea-axe]

  # --8<-- [start:bunny-hop]
  # Speed III and Jump Boost IV for 10 seconds.
  bunny-hop:
    type: effects
    material: RABBIT_FOOT
    name: "&a&lBunny Hop"
    lore:
      - "&7Right click to receive Speed III and"
      - "&7Jump Boost IV for 10 seconds."
    cooldown-seconds: 90
    effects:
      - {effect: speed, level: 3, seconds: 10}
      - {effect: jump_boost, level: 4, seconds: 10}
  # --8<-- [end:bunny-hop]

  # --8<-- [start:ice-berg]
  # Hit a player 3 times with it: Slowness III for 5 seconds.
  ice-berg:
    type: hit-effects
    material: BLUE_ICE
    name: "&b&lIce Berg"
    lore:
      - "&7Hit a player 3 times with this item to"
      - "&7give them Slowness III for 5 seconds."
    cooldown-seconds: 45
    hits-required: 3
    effects:
      - {effect: slowness, level: 3, seconds: 5}
  # --8<-- [end:ice-berg]

  # --8<-- [start:antidote]
  # Takes off your negative effects - Poison, Slowness, Weakness and the like;
  # the others stay. Drunk at once.
  antidote:
    type: cleanse
    material: MILK_BUCKET
    name: "&f&lAntidote"
    lore:
      - "&7Right click to remove your negative effects."
    cooldown-seconds: 60
  # --8<-- [end:antidote]

  # --8<-- [start:golden-head]
  # Eaten at once: Regeneration II for 10 seconds and Absorption I for 2 minutes.
  golden-head:
    type: effects
    material: GOLDEN_APPLE
    name: "&6&lGolden Head"
    lore:
      - "&7Right click to eat it at once: Regeneration II"
      - "&7for 10 seconds and Absorption for 2 minutes."
    cooldown-seconds: 60
    effects:
      - {effect: regeneration, level: 2, seconds: 10}
      - {effect: absorption, level: 1, seconds: 120}
  # --8<-- [end:golden-head]

  # --8<-- [start:grabber]
  # Hit a player with it: they are pulled towards you.
  grabber:
    type: grab
    material: TRIPWIRE_HOOK
    name: "&9&lGrabber"
    lore:
      - "&7Hit a player with this item to pull"
      - "&7them towards you."
    cooldown-seconds: 15
    pull: 1.0                  # stronger above 1, weaker below
    max-speed: 4.0             # the fastest it carries them, in blocks a tick
  # --8<-- [end:grabber]

  # --8<-- [start:potato]
  # Hit a player 3 times with it: Slowness II, Poison II and Nausea for 10
  # seconds.
  potato:
    type: hit-effects
    material: POTATO
    name: "&c&lPotato"
    lore:
      - "&7Hit a player 3 times with this item: Slowness II,"
      - "&7Poison II and Nausea for 10 seconds."
    cooldown-seconds: 120
    hits-required: 3
    effects:
      - {effect: slowness, level: 2, seconds: 10}
      - {effect: poison, level: 2, seconds: 10}
      - {effect: nausea, level: 1, seconds: 10}
  # --8<-- [end:potato]

  # --8<-- [start:fake-pearl]
  # Thrown as an ender pearl, flies as one, teleports nobody. Its cooldown is
  # its own: your real pearls are not held back by it.
  fake-pearl:
    type: fake-pearl
    material: ENDER_PEARL      # a fake-pearl is an ENDER_PEARL
    name: "&5&lFake Pearl"
    lore:
      - "&7Throw it: it flies as a pearl and"
      - "&7teleports nobody."
    cooldown-seconds: 15
  # --8<-- [end:fake-pearl]

  # --8<-- [start:rocket]
  # Launches you about 10 blocks up, with no fall damage for 6 seconds.
  rocket:
    type: rocket
    material: FIREWORK_ROCKET
    name: "&c&lRocket"
    lore:
      - "&7Right click to boost yourself into the air."
    cooldown-seconds: 30
    height: 3.5                # 1 is about 3 blocks
    no-fall-seconds: 6
  # --8<-- [end:rocket]

  # --8<-- [start:combo-fish]
  # For 5 seconds, the players you hit can be hit again after 2 ticks instead
  # of the game's 10: combos as in a combo-fly practice mode.
  combo-fish:
    type: combo-fish
    material: TROPICAL_FISH
    name: "&e&lCombo Fish"
    lore:
      - "&7Right click: for 5 seconds your hits"
      - "&7follow each other much faster."
    cooldown-seconds: 90
    seconds: 5
    hit-delay-ticks: 2
  # --8<-- [end:combo-fish]

  # --8<-- [start:anti-build]
  # Hit a player 3 times with it: for 15 seconds they alone cannot build, break
  # or use the blocked blocks - a block (CHEST) is that block alone; FENCE_GATE
  # covers every fence gate, DOOR every door, BUTTON every button.
  anti-build-bone:
    type: anti-build
    material: BONE
    name: "&a&lAnti-Build Bone"
    lore:
      - "&7Hit a player 3 times with this item: for 15"
      - "&7seconds they cannot build, break or open blocks."
    cooldown-seconds: 120
    hits-required: 3
    seconds: 15
    blocked-blocks: [CHEST, TRAPPED_CHEST, BARREL, FENCE_GATE, TRAPDOOR, DOOR, BUTTON, LEVER]
    user-effects: []
  # --8<-- [end:anti-build]

  # --8<-- [start:rotten-egg]
  # Throw it: the player it hits gets Slowness and Poison for 10 seconds.
  rotten-egg:
    type: thrown-effects
    material: EGG              # SNOWBALL or EGG: it is thrown
    name: "&2&lRotten Egg"
    lore:
      - "&7Throw it at a player: Slowness and"
      - "&7Poison for 10 seconds."
    cooldown-seconds: 30
    effects:
      - {effect: slowness, level: 1, seconds: 10}
      - {effect: poison, level: 1, seconds: 10}
  # --8<-- [end:rotten-egg]

  # --8<-- [start:rage-strength]
  # Strength II for 8 seconds.
  rage-strength:
    type: effects
    material: NETHER_WART
    name: "&4&lRage Strength"
    lore:
      - "&7Right click to receive Strength II"
      - "&7for 8 seconds."
    cooldown-seconds: 120
    effects:
      - {effect: strength, level: 2, seconds: 8}
  # --8<-- [end:rage-strength]

  # --8<-- [start:olympia]
  # A shotgun: 10 burning eggs in a fan 10 degrees wide. Each one that hits a
  # player deals half a heart through armour and sets them on fire for 10
  # seconds. The shot pushes you back - aim down to jump.
  olympia:
    type: shotgun
    material: IRON_HORSE_ARMOR
    name: "&e&lOlympia"
    lore:
      - "&7A shotgun that fires incendiary eggs."
      - "&7The recoil pushes you back."
    cooldown-seconds: 15
    projectiles: 10
    spread: 10                 # degrees, from the leftmost egg to the rightmost
    speed: 1.5                 # how fast the eggs fly
    damage-hearts: 0.5
    fire-seconds: 10
    recoil: 1.0
  # --8<-- [end:olympia]

  # --8<-- [start:baguette]
  # Hit a player 3 times with it: their hunger bar drops to 6 (of 20).
  baguette:
    type: starve
    material: BREAD
    name: "&6&lBaguette"
    lore:
      - "&7Hit a player 3 times with this item"
      - "&7to empty their hunger bar."
    cooldown-seconds: 120
    hits-required: 3
    food-left: 6
  # --8<-- [end:baguette]

  # --8<-- [start:sun]
  # Fireworks burst around you. Every enemy within 8 blocks takes 0.9 heart
  # through armour for each enemy caught - 9 hearts with 10 or more - burns for
  # 5 seconds and is blinded for 2.
  sun:
    type: sun
    material: SUNFLOWER
    name: "&6&lSun"
    lore:
      - "&7Right click to explode the sun: the more"
      - "&7enemies around you, the more it hurts."
    cooldown-seconds: 45
    radius: 8
    damage-hearts-per-player: 0.9
    max-players: 10
    fire-seconds: 5
    blindness-seconds: 2
    fireworks: 6               # how many burst around you: only a sight
  # --8<-- [end:sun]

  # --8<-- [start:scrambler]
  # Hit a player 3 times with it: their hotbar is shuffled.
  scrambler:
    type: scramble
    material: BLAZE_ROD
    name: "&a&lScrambler"
    lore:
      - "&7Hit a player 3 times with this item"
      - "&7to scramble their hotbar."
    cooldown-seconds: 90
    hits-required: 3
  # --8<-- [end:scrambler]

  # --8<-- [start:lucky-bard]
  # Heads or tails, for you: Strength II, Speed II and Regeneration II - or
  # Slowness II, Weakness I and Poison I - for 8 seconds.
  lucky-bard:
    type: lucky-bard
    material: GOLDEN_CARROT
    name: "&6&lLucky Bard"
    lore:
      - "&7Test your luck to receive either"
      - "&7positive or negative effects."
    cooldown-seconds: 60
    positive-chance: 50
    good-effects:
      - {effect: strength, level: 2, seconds: 8}
      - {effect: speed, level: 2, seconds: 8}
      - {effect: regeneration, level: 2, seconds: 8}
    bad-effects:
      - {effect: slowness, level: 2, seconds: 8}
      - {effect: weakness, level: 1, seconds: 8}
      - {effect: poison, level: 1, seconds: 8}
  # --8<-- [end:lucky-bard]

  # --8<-- [start:disarmer-wand]
  # Hit a player with it: a 50% chance the weapon in their hand swaps places
  # with another item of their inventory. Nothing is dropped.
  disarmer-wand:
    type: disarm
    material: BREEZE_ROD
    name: "&6&lDisarmer Wand"
    lore:
      - "&7Hit a player with this item: 50% chance"
      - "&7to disarm them."
    cooldown-seconds: 15
    chance: 50
  # --8<-- [end:disarmer-wand]

  # --8<-- [start:commands-example]
  # A "commands" ability runs console commands, with %player%:
