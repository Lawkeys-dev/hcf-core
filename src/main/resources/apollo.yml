# ---------------------------------------------------------------------------
# apollo.yml - Lunar Client features
#
# For players on Lunar Client only, through Lunar's Apollo. Needs the Apollo
# plugin on the server - Apollo-Bukkit, from lunarclient.dev/apollo/downloads.
# Without it nothing here does anything, and nothing else changes: the rest of
# the plugin never depends on it. Players not on Lunar Client are sent nothing.
#
# Apollo's own configuration can switch each module off for the whole server;
# a module off there stays off whatever this file says.
#
# Changes take effect on /hcf reload: everything sent is taken back and sent
# again as this file now says.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:general]
enabled: true

# How often everything is brought up to date, in ticks (20 = one second). Only
# what changed is sent, except teammates' positions, which move.
update-ticks: 10

# How often everything is sent again even though nothing changed, in seconds.
# Apollo forgets what a player holds whenever it is reloaded - /apollo reload
# clears every waypoint and nametag the server had sent - and nothing tells the
# plugin; this is how they come back.
resend-seconds: 30
# --8<-- [end:general]

# --8<-- [start:waypoints]
# Waypoints on the map and in the world. Names come from lang/en.yml
# (apollo.waypoint.*); capture events use their own display names.
waypoints:
  enabled: true
  hq: true          # your team's HQ
  base: true        # your team's second base
  rally: true       # your team's rally point, while it lasts
  focus: true       # a focused player, where they are; a focused team's HQ
  events: true      # every running event: KOTH and Citadel zones, Conquest zones,
                    # a DTC or Last Break core, a Slide zone, a Totem, the King
  # How far above the event itself its waypoint is put, in blocks (0 to 320).
  # 0 puts it on the objective - the core, the column, the floor of the zone -
  # which is where the beam should start. The King's follows the player and is
  # never raised.
  event-height: 0
  # The pillar of light up from a waypoint, and the outline on the block it stands
  # on. Apollo leaves both off unless asked: without the beam a waypoint is in the
  # player's list and nowhere in the world.
  show-beam: true
  highlight-block: true
  colors:
    hq: "#55FF55"
    base: "#00AA00"
    rally: "#FFFF55"
    focus: "#FF55FF"
    event: "#FFAA00"
# --8<-- [end:waypoints]

# --8<-- [start:team-view]
# Teammates marked above their heads and on the minimap. Beyond tracking-range
# blocks, where the client no longer has them, their position and name are sent.
team-view:
  enabled: true
  marker-color: "#55FF55"
  tracking-range: 48
# --8<-- [end:team-view]

# --8<-- [start:cooldowns]
# Timers shown as Lunar cooldown icons - every cooldown the plugin keeps: the
# combat tag, the ender pearl, the item cooldowns of pvp.yml, a running countdown
# (/spawn, /logout, /team hq, /team stuck...), the partner items (each, the
# shared one, the Pocket Bard's sets), the class items (a Bard's clicks, a
# Rogue's backstab) and the crowbar. Each shows its own item, unless an icon is
# set here. Icons are item names, as the server spells materials.
cooldowns:
  enabled: true
  combat-tag: true
  combat-tag-icon: DIAMOND_SWORD
  warmups: true
  warmup-icon: CLOCK
  abilities: true
  # The shared cooldown after any partner item.
  ability-global-icon: NETHER_STAR
  ender-pearl: true
  ender-pearl-icon: ENDER_PEARL
  # The item cooldowns of pvp.yml (Gapple, Crapple...), each with its own item.
  item-cooldowns: true
  # A class's click items (a Bard's sugar, blaze powder...) and a Rogue's backstab.
  classes: true
  crowbar: true
# --8<-- [end:cooldowns]

# --8<-- [start:nametags]
# The nametag above each player: a team line (left out for a player with no team)
# and a name line. %color% is the colour for how their team relates to yours;
# %team%, %dtr% and %player% are what they say. A focused player - or a member of
# a focused team - takes the focus colour, except to their own team.
nametags:
  enabled: true
  team-line: "%color%%team% {dark}| {warning}%dtr%"
  name-line: "%color%%player%"
  colors:
    self: "&a"
    ally: "&9"
    enemy: "&c"
    focus: "&d"
    neutral: "&f"
# --8<-- [end:nametags]
