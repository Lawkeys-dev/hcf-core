# ---------------------------------------------------------------------------
# HCFCore - Claim (territory) module configuration
# ---------------------------------------------------------------------------
# Every rule the claim module applies lives here; nothing below is duplicated as
# a constant in the plugin's code. Changes take
# effect on /hcf reload.
#
# As in teams.yml, a limit of 0 means "no limit".
#
# Claims are drawn block by block with the claiming wand (see "wand" below): a
# claim is a rectangle, the full height of the world.
#
# ⚠️ Reading this file, remember how protection actually works: who OWNS land is permanent, and is never changed by raiding.
# Whether that owner is currently PROTECTED is a separate, live question
# answered by their DTR. Nothing here can make a raid transfer land - a raid
# only opens the pillage window described under "protection" below.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:enabled]
# Turning this off stops all claiming and all territory protection: nobody
# claims, staff included, and every territory - player land, server land such
# as spawn, and the warzone - can be built on, broken and blown up.
#
# Who owns what is kept, so turning it back on restores every rule exactly as
# it was. PvP on safe zones is not territory protection: pvp.yml has its own
# switch for it (safe-zones.enabled).
enabled: true
# --8<-- [end:enabled]

# --8<-- [start:wand]
# Claims are drawn with the claiming wand, the traditional HCF way: /team claim
# hands it over; left-click a block for the first corner, right-click one for the
# second, then sneak and left-click to claim the rectangle between them - both
# corners included, the full height of the world. Drop the wand to give up. The
# corners are shown as columns only the wand's holder sees. Staff draw server land
# with /team createsystem and /team forceclaim <team>, an event's territory with
# /events claim <id> and its zone with /events setzone <id>.
wand:
  material: GOLDEN_HOE
  name: "{primary}&lClaiming Wand"
  lore:
    - "{muted}Left-click {dark}{bullet} {secondary}first corner"
    - "{muted}Right-click {dark}{bullet} {secondary}second corner"
    - "{muted}Sneak + left-click {dark}{bullet} {success}claim it"
    - "{muted}Drop it {dark}{bullet} {error}give up"
  # The block the corner columns are shown in, and how high they rise (1 to 64).
  pillar-material: GLASS
  pillar-height: 12
  # One block in every few is this instead, counting from the bottom: a column of
  # glass alone is invisible to players using a clear-glass resource pack
  # (0 = marker, 1 = pillar: 0111110111110 with pillar-marker-every: 6).
  pillar-marker-material: GLOWSTONE
  pillar-marker-every: 6
# --8<-- [end:wand]

# --8<-- [start:price]
# What a claim costs, paid from the team bank when it is made (/team deposit).
# Money is what limits a team's land. Staff claims (/team forceclaim) and server
# land are free.
price:
  # Per block of surface: a 20 x 20 claim is 400 blocks.
  per-block: 0.25
  # The share of what a claim cost that /team unclaim gives back, 0 to 100.
  # Worked out on what was paid, never on today's price. Land converted from an
  # earlier version's chunk claims was paid nothing, and refunds nothing.
  refund-percent: 75
# --8<-- [end:price]

# --8<-- [start:sizes]
# The shape of one claim, and how much a team may hold. 0 = no limit.
sizes:
  # The shortest side, in blocks: a strip one block wide around an enemy base is
  # not territory.
  min-side: 5
  # The longest side, in blocks.
  max-side: 128
  # How many separate claims one team may hold.
  max-claims: 0
  # How many blocks of surface one team may hold in all.
  max-total-area: 0
# --8<-- [end:sizes]

# --8<-- [start:placement]
placement:
  # A new claim must share an edge with the team's existing territory in that
  # world. A team may still open a brand new territory in a world it holds
  # nothing in.
  require-connected: true
  # Blocks of land to keep between a claim and another team's. 0 lets teams claim
  # right up against each other. Server land (spawn, roads) is no neighbour.
  buffer-blocks: 8
  # Whether unclaiming may split a team's territory into disconnected pieces.
  allow-disconnecting: false
# --8<-- [end:placement]

# --8<-- [start:map]
map:
  # How /team map is drawn:
  #   pillars - columns on the corners of every claim around you, in the world,
  #             sent to you alone (nothing is ever placed), one kind of block per
  #             team, drawn at random each time and named in the chat under it
  #   chat    - the grid of characters, one cell per few blocks
  # /team map pillars and /team map chat ask for one or the other whatever this says.
  style: pillars
  pillars:
    # How far to look for claims, in chunks.
    radius-chunks: 2
    # How high a column rises above the ground (1 to 64), and how long it stays.
    height: 12
    seconds: 20
    # The blocks the columns may be made of. SOLID blocks only - anything without
    # collision (a torch, a flower, a sign) is left out with a warning. Prefer
    # full cubes: a slab or a pane reads as decoration on a corner. Each team
    # drawn takes one of these at random.
    materials:
      - LIME_CONCRETE
      - RED_CONCRETE
      - BLUE_CONCRETE
      - YELLOW_CONCRETE
      - PURPLE_CONCRETE
      - ORANGE_CONCRETE
      - PINK_CONCRETE
      - CYAN_CONCRETE
      - MAGENTA_CONCRETE
      - BROWN_CONCRETE
      - LIGHT_BLUE_CONCRETE
      - GREEN_CONCRETE
  chat:
    # How many blocks one cell stands for (1 to 64); each cell is judged by the
    # block in its middle. Then how many cells are drawn each way.
    cell-blocks: 8
    radius-x: 12
    radius-z: 6
# --8<-- [end:map]

# --8<-- [start:lock]
# /team lockclaim, during SOTW: nobody but the team's members may enter the
# claim. The players it refuses see a wall of red glass around it - sent to them
# alone, like the claiming wand's columns, never placed in the world.
lock:
  wall:
    enabled: true
    # A block; glass of any colour reads best. Members never see it.
    material: RED_STAINED_GLASS
    # How high it rises above the ground (1 to 32), and how much of the border is
    # drawn around the player, in blocks - the rest is too far to be seen.
    height: 3
    radius-blocks: 24
    # How often it is redrawn as players move, in seconds.
    refresh-seconds: 1
# --8<-- [end:lock]

# --8<-- [start:protection]
protection:
  # Allies may build inside the team's territory.
  allow-ally-build: false
  # Attackers may build and break inside a RAIDABLE team's territory - the
  # pillage window. Turning this off makes claims
  # protected permanently, whatever the owner's DTR.
  allow-raid-building: true
  # Tell players when they cross a territory border.
  announce-territory: true
  # Explosions cannot break blocks in protected territory.
  #
  # Leave this on. Without it every rule above is optional: a player refused a
  # block break simply throws a stick of TNT instead, and the whole protection
  # is decorative.
  #
  # It follows the same rule as a player, asked as a stranger would ask it -
  # an explosion has no team, and attributing it to whoever placed the TNT
  # would be a guess. So a RAIDABLE team's territory still blows up, which is
  # exactly what the pillage window is for, and a protected team's does not.
  block-explosions: true
# --8<-- [end:protection]

# --8<-- [start:homes]
homes:
  # HQ and the secondary base (/team sethq, /team hq, /team setbase, /team base).
  enabled: true
  # A home must sit on land the team owns.
  require-inside-territory: true
  # Countdown before /team hq or /team base teleports; taking damage or leaving
  # the block cancels it, and a combat tag refuses it at the start and again at
  # the end. 0 teleports at once. 10 is a common HCF value, not a rule.
  warmup-seconds: 10
# --8<-- [end:homes]

# --8<-- [start:stuck]
stuck:
  # Countdown before /team stuck moves a player to the nearest free land, with
  # the same cancelling rules as above. It is the one way out of a base short of
  # breaking it, so without a countdown it is a free exit from any trap - and from
  # any raid. 60 is a common HCF value, not a rule.
  warmup-seconds: 60
# --8<-- [end:stuck]

# --8<-- [start:claimable-worlds]
# Worlds where claiming is allowed. Leave the list empty to allow every world.
# Example:
#   claimable-worlds:
#     - world
#     - world_nether
claimable-worlds: []
# --8<-- [end:claimable-worlds]

# --8<-- [start:required-roles]
# Minimum role required for each claim action. One of: leader, co-leader, member.
# An unrecognised value falls back to "leader" and is reported in the console.
required-roles:
  claim: co-leader
  unclaim: leader
  set-home: co-leader
  # /team lockclaim: during SOTW only, nobody but members may enter the claim -
  # so nobody can camp in it until SOTW ends. Allies included. Every lock lapses
  # when SOTW ends, and a restart releases them (a SOTW is hours, not a map).
  lock-claim: co-leader
# --8<-- [end:required-roles]

# ---------------------------------------------------------------------------
# Warzone
# ---------------------------------------------------------------------------
# --8<-- [start:warzone]
# Server land around each world's centre: players fight there, no player team
# can claim it, and - unless allowed below - nobody builds on it.
#
# It sits alongside server teams (/team createsystem <name> <safe|combat>),
# and the most specific rule wins: CLAIMED LAND ALWAYS FOLLOWS ITS OWNER. Spawn
# at the centre stays a safe zone, a road claimed across the warzone keeps its
# own rules, and a player team that held land here before the warzone was set
# up keeps it - ownership never changes. The warzone only governs land nobody
# owns. Inside a Mountain's region, the Mountain's own rules apply instead, so
# its resources stay minable (see resourcenodes.yml).
#
# The radius is in blocks from the centre to each edge of a square, exactly -
# block-precise, like claims.
#
# Off by default: until you list a world below, nothing is reserved.
warzone:
  display-name: "{error}Warzone"

  # Whether players may place and break blocks on unclaimed warzone land.
  # false is the usual HCF rule. Doors, chests and buttons are not building and
  # stay usable either way. Explosions follow this too, as long as
  # protection.block-explosions is on: a charge cannot do what a pickaxe is
  # refused. Turning block-explosions off lets explosions through everywhere,
  # the warzone included - it is the one switch for every explosion rule.
  allow-building: false

  # One entry per world that has a warzone; a world not listed has none.
  # center-x / center-z default to 0. Example:
  #
  #   worlds:
  #     world:
  #       radius: 800
  #     world_nether:
  #       radius: 250
  #       center-x: 0
  #       center-z: 0
  worlds:
# --8<-- [end:warzone]
