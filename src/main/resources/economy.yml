# ---------------------------------------------------------------------------
# HCFCore - Economy configuration
# ---------------------------------------------------------------------------
# Player balances, /pay, and staff management.
# Changes take effect on /hcf reload.
#
# NOTE on precision: balances are stored as floating-point numbers rather than
# an integer number of cents. That is not the usual advice for money, and it is
# a deliberate concession - the Vault Economy interface this module has to expose
# is itself double-based, so anything else would mean converting on every call and
# losing the same precision at the boundary (checked against VaultAPI 1.7).
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:general]
# Turning this off disables balances, /pay, /eco and the team bank commands.
enabled: true

# Balance a player starts with. Nothing is written to the database until their
# balance actually changes, so this costs no storage for players who never earn.
starting-balance: 100.0

# Ceiling per account. 0 = no ceiling.
# A credit that would cross it is refused rather than clamped, so money is never
# silently destroyed.
maximum-balance: 0.0
# --8<-- [end:general]

# --8<-- [start:currency]
currency:
  # Shown before an amount: $1,234.50
  symbol: "$"
  # Used when the amount is named rather than symbolised: "1 dollar", "2 dollars".
  singular: "dollar"
  plural: "dollars"
# --8<-- [end:currency]

# --8<-- [start:pay]
pay:
  # Player-to-player transfers (/pay). Can be turned off without disabling the
  # rest of the economy.
  enabled: true
  # Smallest transfer allowed, to stop 0.01 spam.
  minimum-amount: 1.0
# --8<-- [end:pay]

# --8<-- [start:shop]
# Where players buy and sell for money: signs that staff place (at spawn, as a
# rule), the /shop menu, or both. Only plain items are counted and taken - a
# renamed or enchanted stack is never sold by mistake.
shop:
  enabled: true
  # signs, menu or both.
  mode: both
  # A shop sign, written by staff (hcfcore.economy.shop.admin):
  #   [Buy]  or [Sell]
  #   16             how many per trade (1-64)
  #   Ender Pearl    the item
  #   400            the price of those 16
  # A right click trades one lot; sneaking, a stack's worth (buy) or all you hold (sell).
  signs:
    buy-header: "[Buy]"
    sell-header: "[Sell]"
  # /shop: every item below, a page at a time. amount per trade; buy and sell
  # prices for that amount, 0 for "not offered". Left click buys, right click sells.
  #
  # Priced on a kill being worth 10 (kill-reward below): 16 diamonds sell for
  # five kills, a stack of pearls costs eight. Ores come in, what a fight uses
  # goes out - pearls, food, potion ingredients, building blocks.
  menu:
    items:
      # --- Selling what you mine
      - {material: DIAMOND, amount: 16, buy: 0, sell: 50}
      - {material: EMERALD, amount: 16, buy: 0, sell: 30}
      - {material: GOLD_INGOT, amount: 16, buy: 0, sell: 15}
      - {material: IRON_INGOT, amount: 16, buy: 0, sell: 10}
      - {material: REDSTONE, amount: 64, buy: 0, sell: 8}
      - {material: LAPIS_LAZULI, amount: 64, buy: 0, sell: 8}
      - {material: COAL, amount: 64, buy: 0, sell: 5}
      # --- Fighting
      - {material: ENDER_PEARL, amount: 16, buy: 80, sell: 0}
      - {material: GOLDEN_APPLE, amount: 8, buy: 80, sell: 0}
      - {material: EXPERIENCE_BOTTLE, amount: 64, buy: 50, sell: 0}
      # --- Food
      - {material: GOLDEN_CARROT, amount: 64, buy: 20, sell: 0}
      - {material: COOKED_BEEF, amount: 64, buy: 10, sell: 0}
      # --- Potions
      - {material: GLASS_BOTTLE, amount: 64, buy: 10, sell: 0}
      - {material: NETHER_WART, amount: 64, buy: 30, sell: 0}
      - {material: BLAZE_ROD, amount: 16, buy: 40, sell: 0}
      - {material: GLOWSTONE_DUST, amount: 64, buy: 30, sell: 0}
      - {material: SUGAR, amount: 64, buy: 15, sell: 0}
      - {material: MAGMA_CREAM, amount: 16, buy: 30, sell: 0}
      - {material: GHAST_TEAR, amount: 8, buy: 40, sell: 0}
      # --- Building
      - {material: OBSIDIAN, amount: 16, buy: 40, sell: 0}
      - {material: STONE, amount: 64, buy: 5, sell: 0}
# --8<-- [end:shop]

# --8<-- [start:bounties]
# /bounty <player> <amount> puts money on a player's head, taken from your balance
# at once; whoever kills them collects all of it. Bounties on one player add up
# and survive a restart. A teammate or an ally of the target cannot collect it.
# /bounty lists the largest; staff clear one with /bounty clear <player>
# (hcfcore.economy.bounty.admin) - the money is not given back.
bounties:
  enabled: true
  # The least one placement may add: five kills' worth.
  minimum-amount: 50.0
  # Tell everybody when a bounty is placed. Collecting one is always announced.
  announce: true
  # How many bounties /bounty lists.
  list-size: 10
# --8<-- [end:bounties]

# --8<-- [start:kill-reward]
# Money for a kill: a flat amount, and, if you want kills to cost something too, a
# share taken from the dead player's balance. Nothing for killing an ally, and
# nothing again for the same victim within same-victim-cooldown-seconds - two
# accounts trading kills is the first thing a kill reward invites.
kill-reward:
  enabled: true
  # The unit the rest of the economy is priced on (the shop, bounties).
  amount: 10.0
  # The share of the victim's balance moved to the killer, 0 to 100.
  steal-percent: 0
  same-victim-cooldown-seconds: 300
# --8<-- [end:kill-reward]
