# --8<-- [start:bounties]
# /bounty <player> <amount> puts money on a player's head, taken from your balance
# at once; whoever kills them collects all of it. Bounties on one player add up
# and survive a restart. A teammate or an ally of the target cannot collect it.
# /bounty lists the largest; staff clear one with /bounty clear <player>
# (hcfcore.economy.bounty.admin) - the money is not given back.
bounties:
  enabled: true
  # The least one placement may add: five kills' worth.
  minimum-amount: 50.0
  # Tell everybody when a bounty is placed. Collecting one is always announced.
  announce: true
  # How many bounties /bounty lists.
  list-size: 10
# --8<-- [end:bounties]

# --8<-- [start:kill-reward]
# Money for a kill: a flat amount, and, if you want kills to cost something too, a
# share taken from the dead player's balance. Nothing for killing an ally, and
# nothing again for the same victim within same-victim-cooldown-seconds - two
# accounts trading kills is the first thing a kill reward invites.
kill-reward:
  enabled: true
  # The unit the rest of the economy is priced on (the shop, bounties).
  amount: 10.0
  # The share of the victim's balance moved to the killer, 0 to 100.
  steal-percent: 0
  same-victim-cooldown-seconds: 300
# --8<-- [end:kill-reward]
