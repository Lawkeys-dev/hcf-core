# ---------------------------------------------------------------------------
# HCFCore - Economy configuration
# ---------------------------------------------------------------------------
# Player balances, /pay, and staff management.
# Changes take effect on /hcf reload.
#
# NOTE on precision: balances are stored as floating-point numbers rather than
# an integer number of cents. That is not the usual advice for money, and it is
# a deliberate concession - the Vault Economy interface this module has to expose
# is itself double-based, so anything else would mean converting on every call and
# losing the same precision at the boundary (checked against VaultAPI 1.7).
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:general]
# Turning this off disables balances, /pay, /eco and the team bank commands.
enabled: true

# Balance a player starts with. Nothing is written to the database until their
# balance actually changes, so this costs no storage for players who never earn.
starting-balance: 100.0

# Ceiling per account. 0 = no ceiling.
# A credit that would cross it is refused rather than clamped, so money is never
# silently destroyed.
maximum-balance: 0.0
# --8<-- [end:general]

# --8<-- [start:currency]
currency:
  # Shown before an amount: $1,234.50
  symbol: "$"
  # Used when the amount is named rather than symbolised: "1 dollar", "2 dollars".
  singular: "dollar"
  plural: "dollars"
# --8<-- [end:currency]

# --8<-- [start:pay]
pay:
  # Player-to-player transfers (/pay). Can be turned off without disabling the
  # rest of the economy.
  enabled: true
  # Smallest transfer allowed, to stop 0.01 spam.
  minimum-amount: 1.0
# --8<-- [end:pay]

# --8<-- [start:shop]
# Where players buy and sell for money: signs that staff place (at spawn, as a
# rule), the /shop menu, or both. Only plain items are counted and taken - a
# renamed or enchanted stack is never sold by mistake.
shop:
  enabled: true
  # signs, menu or both.
  mode: both
  # A shop sign, written by staff (hcfcore.economy.shop.admin):
  #   [Buy]  or [Sell]
  #   16             how many per trade (1-64)
  #   Ender Pearl    the item
  #   80             the price of those 16
  # A right click trades one lot; sneaking, a stack's worth (buy) or all you hold (sell).
  signs:
    buy-header: "[Buy]"
    sell-header: "[Sell]"
  # /shop: the shelves below; a click opens one. Each has its name, the item that
  # stands for it, and its items: amount per trade, then buy and sell prices for
  # that amount - 0 for "not offered". Left click buys, right click sells. (A plain
  # "items:" list under menu, without categories, is one shelf of its own.)
  #
  # Priced on a kill being worth 10 (kill-reward below): 16 diamonds sell for five
  # kills, a stack of pearls costs eight. Ores come in; what a fight, a base and a
  # brewing stand use goes out. The shop never buys back what it sells, so nothing
  # can be bought and sold at a profit.
  menu:
    categories:
      # Selling what you mine.
      ores:
        name: "{primary}Ores"
        icon: DIAMOND
        items:
          - {material: DIAMOND, amount: 16, buy: 0, sell: 50}
          - {material: EMERALD, amount: 16, buy: 0, sell: 30}
          - {material: GOLD_INGOT, amount: 16, buy: 0, sell: 15}
          - {material: IRON_INGOT, amount: 16, buy: 0, sell: 10}
          - {material: QUARTZ, amount: 64, buy: 0, sell: 10}
          - {material: REDSTONE, amount: 64, buy: 0, sell: 8}
          - {material: LAPIS_LAZULI, amount: 64, buy: 0, sell: 8}
          - {material: COAL, amount: 64, buy: 0, sell: 5}
      # What a fight uses.
      combat:
        name: "{error}Combat"
        icon: DIAMOND_SWORD
        items:
          - {material: ENDER_PEARL, amount: 16, buy: 80, sell: 0}
          - {material: GOLDEN_APPLE, amount: 8, buy: 80, sell: 0}
          - {material: EXPERIENCE_BOTTLE, amount: 64, buy: 50, sell: 0}
          - {material: ARROW, amount: 64, buy: 15, sell: 0}
          - {material: BOW, amount: 1, buy: 10, sell: 0}
          - {material: FISHING_ROD, amount: 1, buy: 5, sell: 0}
          - {material: SNOWBALL, amount: 16, buy: 5, sell: 0}
      # Leather armour and every dye: an Archer's set.
      archer:
        name: "{success}Archer"
        icon: LEATHER_CHESTPLATE
        items:
          - {material: LEATHER_HELMET, amount: 1, buy: 5, sell: 0}
          - {material: LEATHER_CHESTPLATE, amount: 1, buy: 5, sell: 0}
          - {material: LEATHER_LEGGINGS, amount: 1, buy: 5, sell: 0}
