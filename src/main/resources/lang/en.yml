    no-pearls: "&cEnder pearls do not work inside the Citadel."
    no-partner-items: "&cPartner items do not work inside the Citadel - only class abilities do."
    no-chorus: "&cChorus fruit does not work inside the Citadel."
    no-elytra: "&cElytra do not work inside the Citadel."
    no-riptide: "&cRiptide does not work inside the Citadel."

  # Above each capture zone (events.yml, zone-holograms), one line per key.
  hologram:
    title: "&6&l%event%"
    conquest-title: "&6&l%event% &7- &f%zone%"
    time-left: "&7Time left: &f%time%"
    held-by: "&7Held by &a%team%"
    contested: "&cContested"
    free: "&7Nobody holds it"
    next: "&7Next: &f%time%"
    unscheduled: "&7Not scheduled"

  broadcast:
    started: "&e%event% &6has started! &7Hold it for &f%time% &7to win. &8(%zone%)"
    capture-began: "&f%team% &eis capturing &f%event%&e. &7%time% &7remaining."
    contested: "&c%event% &7is contested - the countdown is frozen."
    control-lost: "&7Nobody is holding &f%event% &7any more. &8(%time% left)"
    progress: "&e%event%&7: &f%time% &7remaining, held by &f%team%&7."
    captured: "&a%team% &6captured &e%event%&6!"
    expired: "&7%event% &7ended with no winner."
    stopped: "&7%event% &7has been stopped."

  list:
    header: "&7&m--------&r &bEvents &7&m--------"
