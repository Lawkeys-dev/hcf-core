# ---------------------------------------------------------------------------
# Staff tools
# ---------------------------------------------------------------------------
staff:
  mode:
    entered: "&aStaff mode on&7. Your items are held safely until you leave it."
    left: "&7Staff mode off. Your items are back."
    announce-entered: "&8[&9Staff&8] &b%player% &7entered staff mode."
    announce-left: "&8[&9Staff&8] &b%player% &7left staff mode."
    # Refused rather than overwrite: the held inventory is the real one.
    already-held: "&cYour items from an earlier session are still held. &7Rejoin the server to get them back before using staff mode."
    stash-restored: "&aYour items have been given back&7 - the server stopped while you were in staff mode."
    # Their inventory stays held in the database; the next login tries again.
    restore-failed: "&cYour items could not be given back. &7They are kept safe and will be given back when you rejoin; the error is in the server log."
    item-needs-target: "&cRight-click a player with that item."
    list-header: "&9Staff mode &7(&f%count%&7):"
    list-entry: "&7- &b%player%"
    list-empty: "&7Nobody is in staff mode."

  # "enabled"/"disabled" and not "on"/"off": YAML reads a bare on/off/yes/no as a
  # boolean, so `on:` would become the key `true` and the message would never be
  # found. Keep them spelled out.
  vanish:
    enabled: "&aYou are now hidden&7 from players who cannot see vanished staff."
    disabled: "&7You are visible again."

  chat:
    enabled: "&aStaff chat on&7 - what you type goes to the staff channel."
    disabled: "&7Staff chat off."

  build:
    enabled: "&aStaff build on&7 - you can build through territory protection."
    # Toggled on by staff who lack hcfcore.claim.bypass: the toggle alone lifts nothing.
    enabled-without-bypass: "&eStaff build on&7, but you do not hold &fhcfcore.claim.bypass&7: territory protection still applies to you."
    disabled: "&7Staff build off."

  teleport:
    to-player: "&7Teleported to &b%player%&7."
    player-here: "&7Teleported &b%player% &7to you."
    all: "&7Teleported &f%count% &7player(s) to you."
    location: "&7Teleported to &f%x%&7, &f%y%&7, &f%z% &7in &f%world%&7."
    nobody-else: "&cThere is nobody else online."
    location-told: "&b%player% &7is at &f%x%&7, &f%y%&7, &f%z% &7in &f%world%&7."

  near:
    header: "&9%count% player(s) &7within &f%radius% &7blocks:"
    entry: "&7- &b%player% &7(&f%distance%&7 block(s))"
    empty: "&7Nobody within &f%radius% &7blocks."

  dimension:
    header: "&9%dimension% &7(&f%count%&7):"
    entry: "&7- &b%player%"
    empty: "&7Nobody is in &f%dimension%&7."
    missing: "&cThere is no world named '%world%'."

  chat-cleared: "&8[&9Staff&8] &b%player% &7cleared the chat."

  error:
    player-not-found: "&c'%player%' is not online."
    invalid-number: "&c'%input%' is not a number."
    disabled: "&cThe staff module is disabled."
    usage: "&cUsage: &f%usage%"

  # Freeze, and the ban that follows running from one
  freeze:
    applied: "&aYou froze &b%player%&7."
    released: "&7You released &b%player%&7."
    target-frozen: "&c&lYOU HAVE BEEN FROZEN &7by &b%player%&7. &fDo not log out - leaving now results in a ban. Talk to them in chat."
    target-released: "&aYou have been released&7. Thanks for waiting."
    reminder: "&c&lFROZEN &7- stay here and talk to &b%player%&7. Logging out results in a ban."
    blocked: "&cYou cannot do that while frozen."
    already-held: "&c%player% is already frozen by &b%holder%&7."
    list-header: "&9Frozen &7(&f%count%&7):"
    list-entry: "&7- &b%player% &7(held by &f%holder%&7)"
    list-empty: "&7Nobody is frozen."
    logout-announce: "&8[&9Staff&8] &c%player% logged out while frozen &7and has been banned."

  ban:
    login-denied: "&cYou were banned for logging out while frozen.&7 Appeal with the staff team."
    lifted: "&aLifted the ban on &b%player%&7."
    not-banned: "&c%player% is not banned."
    reason-frozen-logout: "logged out while frozen"

  invsee:
    opened: "&7Viewing &b%player%&7's inventory."
    read-only: "&7This view is &fread-only&7."
    editable: "&c&lEDITABLE &7- what you change here changes their real inventory."
    armour: "&7Armour: &f%armour% &7| Off-hand: &f%offhand%"
