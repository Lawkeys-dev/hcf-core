    list-entry: "&7#&f%id% &7[&f%state%&7] &f%reason%%subject% &7- by &b%staff%&7, &f%age% &7ago"
    none: "&7%team% has no strikes."
    pardoned: "&7Pardoned strike &f#%id%&7. Points taken, and a disband, are not given back."
