    claimed: "&aTicket &f#%id% &ais yours."
    already-claimed: "&cTicket #%id% is not open - somebody may already have it."
    closed: "&7Closed ticket &f#%id%&7."
    unknown: "&cThere is no open ticket #%id%."
    nobody-to-visit: "&cNobody on ticket #%id% is online to teleport to."
