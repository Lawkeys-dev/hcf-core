  protection:
    claimed: "&cThis land belongs to &f%team%&c."
    ally: "&cThis land belongs to your ally &f%team%&c."
    system: "&cThis is a protected server area."
    warzone: "&cNothing can be built in the %warzone%&c."

  territory:
    enter: "&7Now entering &f%team%&7."
    leave: "&7Now leaving &f%team%&7."

  info:
    header: "&7&m--------&r &bChunk %chunk% &7&m--------"
    owner: "&7Owner: &f%team%"
