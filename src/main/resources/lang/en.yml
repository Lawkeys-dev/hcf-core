# ---------------------------------------------------------------------------
# HCFCore - English language file
# ---------------------------------------------------------------------------
# No player-facing text exists anywhere in the Java code: every message is looked
# up here by key. To translate, copy this file to lang/<code>.yml, translate it,
# and set "language: <code>" in config.yml. An empty message is not sent.
#
# Key convention: <module>.<context>.<message>
# Keys are fully nested (a "team:" section containing a "create:" section
# containing "success:"), never written as a dotted key on one line.
#
# Colours are the theme's (theme.yml): {primary}, {secondary}, {text}, {muted},
# {dark}, {success}, {error}, {warning} - change a colour there and it changes in
# every message. {prefix} starts the announcements, {bullet} is the list symbol.
# Legacy codes (&a, &l...) and hex colours (&#rrggbb) work too. Placeholders are
# wrapped in percent signs and are substituted by name, so their order in a
# sentence is free to change between translations.
# ---------------------------------------------------------------------------

general:
  reload-success: "{success}Configuration reloaded successfully."
  reload-failed: "{error}Reload failed: %error% {muted}(see console)"
  no-permission: "{error}You do not have permission to use this command."
  player-only: "{error}This command can only be used by players."
  version: "{muted}Running {secondary}HCFCore v%version% {muted}in {secondary}%mode% {muted}mode."
  unknown-command: "{error}Unknown command. Try {secondary}/%label% help{error}."

# Until every module has loaded its data, players are refused at login, and the
# commands that read or change that data answer with one of these instead of
# running. "failed" means a load did not succeed: the server stays closed until
# the cause is fixed and it is restarted.
startup:
  login:
    loading: "{warning}The server is still starting up. {muted}Try again in a few seconds."
    failed: "{error}The server could not load its data. {muted}Please try again later."
  command:
    loading: "{warning}HCFCore is still loading its data. {muted}Try again in a few seconds."
    failed: "{error}HCFCore could not load its data, so this command is unavailable. {muted}See the console, then restart the server."

team:
  # How a role is written in messages (%role%, %required%).
  role:
    leader: "Leader"
    co-leader: "Co-leader"
    member: "Member"

  # --- Name validation ---------------------------------------------------
  name:
    too-short: "{error}A team name must be at least %min% characters long."
    too-long: "{error}A team name may be at most %max% characters long."
    invalid-characters: "{error}'%name%' contains characters that are not allowed in a team name."
    blacklisted: "{error}That team name is reserved."
    taken: "{error}A team named '%name%' already exists."

  # --- Shared failures ---------------------------------------------------
  error:
    not-in-team: "{error}You are not in a team."
    target-not-in-team: "{error}That player is not in your team."
    not-a-member: "{error}You are not a member of %team%."
    insufficient-role: "{error}You must be at least %required% to do that (you are %role%)."
    cannot-target-self: "{error}You cannot target yourself."
    system-team-immutable: "{error}%team% is a server team and cannot be modified."
    not-system-team: "{error}%team% is a player team; only server teams are safe or combat zones."
    team-full: "{error}That team is full (%max% members)."
    not-found: "{error}No team named '%name%' was found."
    player-not-found: "{error}No player named '%player%' was found."

  # --- Lifecycle ---------------------------------------------------------
  # --- Server (system) teams: safe zones and combat zones -------------------
  system:
    created-safe: "{success}Server team {secondary}%team% {success}created as a {secondary}safe zone {success}(no PvP while pvp.yml's safe-zones is on). Draw its land with the claiming wand {muted}(again later: {secondary}/team forceclaim %team%{muted}){success}."
    created-combat: "{success}Server team {secondary}%team% {success}created as a {secondary}combat zone {success}(PvP on). Draw its land with the claiming wand {muted}(again later: {secondary}/team forceclaim %team%{muted}){success}."
    zone-safe: "{secondary}%team% {success}is now a {secondary}safe zone{success}: nobody can be attacked on its land while pvp.yml's safe-zones is on."
    zone-combat: "{secondary}%team% {success}is now a {secondary}combat zone{success}: players can fight on its land."
    invalid-zone: "{error}'%input%' is not a zone kind - use safe or combat."

  create:
    success: "{success}Team {secondary}%team% {success}created. Invite members with {secondary}/team invite <player>{success}."
    already-in-team: "{error}You are already in a team. Leave it first."
    cancelled: "{error}Team creation was cancelled."
  disband:
    success: "{success}Team {secondary}%team% {success}has been disbanded."
    cancelled: "{error}Disbanding the team was cancelled."
    broadcast: "{prefix}{error}Your team has been disbanded by %player%."
  rename:
    success: "{success}Team renamed from {secondary}%old% {success}to {secondary}%name%{success}."
    same-name: "{error}Your team is already called '%name%'."
    cancelled: "{error}Renaming the team was cancelled."
    broadcast: "{prefix}{warning}Your team was renamed to {secondary}%name% {warning}by %player%."

  # --- Invitations -------------------------------------------------------
  invite:
    sent: "{success}Invitation sent."
    received: "{warning}%player% invited you to join {secondary}%team%{warning}. Use {secondary}/team join %team% {warning}to accept."
    already-sent: "{error}That player already has a pending invitation."
    target-in-team: "{error}That player is already in a team."
    revoked: "{success}Invitation revoked."
    not-found: "{error}That player has no pending invitation from your team."
    broadcast: "{prefix}{warning}%player% invited %target% to the team."
  join:
    success: "{success}You joined {secondary}%team%{success}."
    no-invite: "{error}You have no pending invitation from %team%."
    already-in-team: "{error}You are already in a team."
    broadcast: "{prefix}{success}%player% joined the team."
    # /team forcejoin, to the staff member who typed it.
    forced: "{success}Put {secondary}%player% {success}in {secondary}%team%{success}."
    forced-already-in-team: "{error}%player% is already in a team."

  # --- Leaving -----------------------------------------------------------
  leave:
    success: "{success}You left {secondary}%team%{success}."
    leader-must-transfer: "{error}Hand over leadership before leaving {secondary}%team%{error}."
    disbanded: "{success}You left {secondary}%team%{success}, and as its last member the team was disbanded."
    broadcast: "{prefix}{warning}%player% left the team."
  kick:
    success: "{success}Player kicked from the team."
    kicked: "{error}You were kicked from {secondary}%team% {error}by %player%."
    broadcast: "{prefix}{warning}%target% was kicked from the team by %player%."

  # --- Roles -------------------------------------------------------------
  promote:
    success: "{success}Promoted to {secondary}%role%{success}."
    already-highest: "{error}That player is already %role% - use {secondary}/team transfer {error}to hand over leadership."
    co-leader-limit: "{error}Your team already has the maximum of %max% co-leaders."
    broadcast: "{prefix}{success}%target% was promoted to %role% by %player%."
  demote:
    success: "{success}Demoted to {secondary}%role%{success}."
    already-lowest: "{error}That player is already %role%."
    cannot-demote-leader: "{error}The leader cannot be demoted - hand over leadership instead."
    broadcast: "{prefix}{warning}%target% was demoted to %role% by %player%."
  transfer:
    success: "{success}Leadership of {secondary}%team% {success}has been handed over."
    broadcast: "{prefix}{warning}%target% is now the leader of the team."
    # /team forcekick removed the leader: to the staff member, who took over.
    forced: "{muted}%player% {muted}now leads {secondary}%team%{muted}, in place of the player you removed."

  # --- Alliances ---------------------------------------------------------
  ally:
    disabled: "{error}Alliances are disabled on this server."
    same-team: "{error}You cannot ally your own team."
    already-allied: "{error}You are already allied with %team%."
    request-sent: "{success}Alliance request sent to {secondary}%team%{success}."
    request-already-sent: "{error}You already have a pending alliance request to %team%."
    now-allied: "{success}You are now allied with {secondary}%team%{success}."
    limit-reached: "{error}Your team has reached its alliance limit (%max%)."
    target-limit-reached: "{error}%team% has reached its alliance limit (%max%)."
    received: "{prefix}{warning}%team% has requested an alliance. Use {secondary}/team ally %team% {warning}to accept."
    broadcast: "{prefix}{success}Your team is now allied with {secondary}%team%{success}."
  unally:
    success: "{success}Alliance with {secondary}%team% {success}broken."
    not-allied: "{error}You are not allied with %team%."
    broadcast: "{prefix}{error}Your team is no longer allied with {secondary}%team%{error}."

  # --- Focus -------------------------------------------------------------
  focus:
    disabled: "{error}Focus is disabled on this server."
    team-success: "{success}Your team is now focusing {secondary}%target%{success}."
    player-success: "{success}Your team is now focusing {secondary}%target%{success}."
    already-focused: "{error}Your team is already focusing %target%."
    limit-reached: "{error}Your team can focus at most %max% target(s) at once."
    cannot-focus-own-team: "{error}You cannot focus your own team."
    broadcast: "{prefix}{warning}Your team is now focusing {secondary}%target%{warning}."
  unfocus:
    success: "{success}No longer focusing {secondary}%target%{success}."
    not-focused: "{error}Your team is not focusing %target%."

  # --- Rally -------------------------------------------------------------
  rally:
    disabled: "{error}Rally is disabled on this server."
    set: "{success}Rally point set. It stays active for %seconds% seconds."
    cleared: "{success}Rally point cleared."
    not-set: "{error}Your team has no rally point set."
    broadcast: "{prefix}{warning}%player% set a rally point. Your compass now points to it."

  # --- Bank, points, KOTH ------------------------------------------------
  bank:
    disabled: "{error}Team banks are disabled on this server."
    invalid-amount: "{error}Enter a positive amount."
    insufficient-funds: "{error}Your team bank only holds %balance%."
    deposit-success: "{success}Deposited %amount%. Team balance: %balance%."
    withdraw-success: "{success}Withdrew %amount%. Team balance: %balance%."
  points:
    set: "{success}Points for {secondary}%team% {success}set to {secondary}%points%{success}."
    added: "{success}%amount% point(s) applied to {secondary}%team%{success}. New total: {secondary}%points%{success}."
  koth:
    cap-reached: "{warning}%team% has reached its cap of %max% counted KOTH capture(s)."
    capture-counted: "{success}KOTH capture recorded for {secondary}%team% {success}(%captures% total)."
    reset: "{muted}Counted KOTH captures reset for {secondary}%count% {muted}team(s)."

  # --- Command layer -----------------------------------------------------
  command:
    unknown-subcommand: "{error}Unknown subcommand '{secondary}%input%{error}'. Try {secondary}/%label% help{error}."
    usage: "{error}Usage: {secondary}/%label% %usage%"
    help-header: "{muted}&m--------&r {secondary}Team commands {muted}&m--------"
    help-entry: "{secondary}/%label% %usage% {muted}- {muted}%description%"
    invalid-number: "{error}'%input%' is not a valid number."

  info:
    header: "{muted}&m--------&r {secondary}%team% {muted}&m--------"
    leader: "{muted}Leader: {secondary}%leader%"
    co-leaders: "{muted}Co-leaders: {secondary}%members%"
    members: "{muted}Members: {secondary}%members%"
    online: "{muted}Online: {secondary}%online%{muted}/{secondary}%total%"
    balance: "{muted}Balance: {secondary}%balance%"
    points: "{muted}Points: {secondary}%points%"
    koth-captures: "{muted}KOTH captures: {secondary}%captures%"
    # Shown from a team's first active strike; what it was for is not said.
    strikes: "{muted}Strikes: {error}%strikes%"
    allies: "{muted}Allies: {secondary}%allies%"
    rally: "{muted}Rally: {secondary}%world% %x%, %y%, %z%"
    none: "{muted}none"
    zone-safe: "{muted}Server land - {success}safe zone{muted}: nobody can be attacked here."
    zone-combat: "{muted}Server land - {error}combat zone{muted}: players can fight here."

  list:
    header: "{muted}&m--------&r {secondary}Top teams {muted}&m--------"
    entry: "{muted}%rank%. {secondary}%team% {muted}- {secondary}%points% {muted}point(s), {secondary}%members% {muted}member(s)"
    empty: "{muted}No teams have been created yet."

  chat:
    switched: "{success}You are now talking in {secondary}%channel% {success}chat."
    format-team: "{primary}[Team] {secondary}%player%{muted}: {secondary}%message%"
    format-ally: "{primary}[Ally] {secondary}%player%{muted}: {secondary}%message%"
    # The console's copy of a team or ally line (chat.yml, log-team-chat). It names
    # the team, which the members do not need but whoever reads the log does.
    # %channel% is TEAM or ALLY.
    log: "[%channel%] %team% - %player%: %message%"

# ---------------------------------------------------------------------------
# Claim / territory module
# ---------------------------------------------------------------------------
claim:

  # /team hq, /team base and /team stuck share their countdowns with /spawn and
  # /logout, so only one can run at a time.
  warmup-busy: "{error}You are already counting down to something."

  claim:
    # %size% is width x length in blocks, %area% the blocks of surface, %cost% the price.
    success: "{success}Claimed {secondary}%size% {muted}(%area% blocks) {success}for {secondary}%cost%{success}. Your team now holds {secondary}%claims% {success}claim(s)."
    already-yours: "{error}That overlaps your own claim %claim%."
    already-owned: "{error}That overlaps {secondary}%team%{error}'s land. Raiding a team never gives you its land."
    # sizes.max-total-area
    limit-reached: "{error}Your team may hold at most %max% blocks of land (currently %current%)."
    too-small: "{error}A claim must be at least {secondary}%min%x%min%{error} - that is {secondary}%size%{error}."
    too-big: "{error}A claim's sides may be at most {secondary}%max%{error} blocks - that is {secondary}%size%{error}."
    too-many-claims: "{error}Your team may hold at most {secondary}%max% {error}separate claims."
    cannot-afford: "{error}That costs {secondary}%cost%{error}; your team's bank holds {secondary}%balance%{error}. {muted}/team deposit <amount>"
    not-connected: "{error}A claim must share an edge with your existing territory in this world."
    too-close: "{error}Too close to {secondary}%team%{error}'s territory - keep at least %distance% blocks away."
    world-disabled: "{error}Claiming is disabled in %world%."
    disabled: "{error}Claiming is disabled on this server."
    system-team: "{error}%team% is a server team; only staff can claim for it."
    nothing-selected: "{error}Nothing selected."
    warzone: "{error}That reaches into the %warzone%{error}: no player team can claim there."
    reserved-region: "{error}That overlaps %region%{error} and cannot be claimed."

  # The claiming wand (/team claim, /team forceclaim, /team createsystem, /events claim|setzone).
  wand:
    given: "{success}Claiming wand for {secondary}%task%{success}. {muted}Left-click a corner, right-click the other, sneak + left-click to confirm; drop it to give up."
    inventory-full: "{error}Make room in your inventory for the claiming wand."
    first-corner: "{muted}First corner {dark}{bullet} {secondary}%x%, %z%"
    second-corner: "{muted}Second corner {dark}{bullet} {secondary}%x%, %z%"
    selection: "{muted}Selected {secondary}%size% {muted}(%area% blocks)."
    confirm-hint: "{muted}Sneak + left-click to confirm, or drop the wand to give up."
    incomplete: "{error}Pick both corners first: left-click one, right-click the other."
    cancelled: "{muted}Claim cancelled."
    expired: "{muted}That wand was no longer in use and has been taken back."
    free: "{success}This one is free."
    cost: "{muted}Cost {dark}{bullet} {secondary}%cost% {muted}(team bank: {success}%balance%{muted})"
    cost-short: "{muted}Cost {dark}{bullet} {error}%cost% {muted}(team bank: {error}%balance%{muted}) {muted}- /team deposit <amount>"

  admin:
    unclaimed: "{success}Released %claim% from {secondary}%team%{success}."
    forceclaim-usage: "{error}/team forceclaim <team> {muted}for the wand, or {error}/team forceclaim <team> <x1> <z1> <x2> <z2> [world] {muted}- the world is required from the console."
    forceunclaim-console: "{error}From the console, only {secondary}/team forceunclaim <team> all{error}: there is nowhere you stand."
    unclaimed-all: "{success}Released all {secondary}%count% {success}claim(s) of {secondary}%team%{success}."

  unclaim:
    success: "{success}Released the {secondary}%size% {success}claim; {secondary}%refund% {success}back to your team's bank. {muted}%claims% claim(s) left."
    not-yours: "{error}This land belongs to {secondary}%team%{error}."
    not-claimed: "{error}Nobody owns this land."
    nothing: "{error}Your team holds no land."
    all-success: "{success}Released all {secondary}%count% {success}of your team's claims; {secondary}%refund% {success}back to the bank."
    would-disconnect: "{error}Releasing %claim% would split your territory in two."

  home:
    set: "{success}Your team's %type% has been set here."
    not-set: "{error}Your team has no %type% set."
    not-in-territory: "{error}Your %type% must be inside your own territory."
    disabled: "{error}Team homes are disabled on this server."
    world-unloaded: "{error}The world '%world%' is not loaded."
    teleported: "{success}Teleported to your team's %type%."
    warmup: "{muted}Teleporting to your team's %type% in {secondary}%time%s{muted}. Do not move or take damage."
    cancelled: "{error}Teleport cancelled."

  lock:
    locked: "{success}Your claim is locked{muted}: nobody but your team can enter it until SOTW ends."
    unlocked: "{muted}Your claim is open again."
    not-now: "{error}A claim can only be locked during SOTW."
    entry-denied: "{error}%team%'s claim is locked until the end of SOTW."
    expelled: "{muted}You were moved out of {secondary}%team%{muted}'s claim: it is locked until the end of SOTW."
    broadcast-locked: "{prefix}{warning}%player% locked the team's claim until the end of SOTW."
    broadcast-unlocked: "{prefix}{warning}%player% opened the team's claim again."

  protection:
    claimed: "{error}This land belongs to {secondary}%team%{error}."
    ally: "{error}This land belongs to your ally {secondary}%team%{error}."
    system: "{error}This is a protected server area."
    warzone: "{error}Nothing can be built in the %warzone%{error}."

  territory:
    enter: "{muted}Now entering {secondary}%team%{muted}."
    leave: "{muted}Now leaving {secondary}%team%{muted}."

  info:
    header: "{muted}&m--------&r {secondary}%x%, %z% {muted}&m--------"
    owner: "{muted}Owner: {secondary}%team%"
    wilderness: "{muted}This is unclaimed wilderness."
    warzone: "{muted}This is part of the %warzone%{muted}: players fight here, and no player team can claim it."
    # The claim here: %size%, %area% blocks, from %x1%, %z1% to %x2%, %z2%.
    claim: "{muted}Claim: {secondary}%size% {muted}(%area% blocks) from {secondary}%x1%, %z1% {muted}to {secondary}%x2%, %z2%"
    raidable: "{error}Raidable {muted}- its protection is currently down."
    protected: "{success}Protected."
    unenforced: "{warning}Unprotected {muted}- territory protection is turned off on this server."
    count: "{muted}Territory: {secondary}%count% {muted}claim(s), {secondary}%area% {muted}blocks"

  map:
    # /team map with pillars (claims.yml, map.style): columns on the corners of the
    # claims around you, shown to you alone for %seconds% seconds.
    pillars-header: "{success}%claims% claim(s) {muted}around you, marked for {secondary}%seconds%s{muted}:"
    # Which block is which team: read on the pillars around you.
    pillars-team: "{muted}• {secondary}%block% {dark}{bullet} {primary}%team%"
    pillars-hidden: "{muted}The territory markers are gone. {dark}(/team map again to bring them back)"
    pillars-empty: "{muted}No claim within %radius% chunk(s) of you."
    style-unknown: "{error}'%style%' is not a map style {muted}- {secondary}pillars {muted}or {secondary}chat{muted}."
    # %cell% is how many blocks one character stands for (claims.yml, map.chat.cell-blocks).
    header: "{muted}&m--------&r {secondary}Territory around %x%, %z% {muted}(1 = %cell% blocks) &m--------"
    row: "%row%"
    legend: "{muted}Legend: {warning}+ {muted}you  {success}# {muted}your team  {primary}# {muted}ally  {error}# {muted}enemy  {secondary}# {muted}server  {error}# {muted}warzone  {muted}- {muted}wilderness"

  stuck:
    moved: "{success}You have been moved to the nearest free land."
    nowhere: "{error}No free land nearby. {muted}Ask a staff member for help."
    not-stuck: "{error}You are not stuck - you are standing on land you may be on."
    warmup: "{muted}Moving you to the nearest free land in {secondary}%time%s{muted}. Do not move or take damage."
    cancelled: "{error}Stuck cancelled."

  error:
    not-in-team: "{error}You need a team to hold territory."
    insufficient-role: "{error}You must be at least %required% to do that (you are %role%)."

# ---------------------------------------------------------------------------
# DTR module
# ---------------------------------------------------------------------------
dtr:

  info:
    header: "{muted}&m--------&r {secondary}DTR - %team% {muted}&m--------"
    current: "{muted}DTR: {secondary}%dtr%{muted}/{secondary}%max%"
    raidable: "{error}&lRAIDABLE {muted}- this team's territory is open to raiding."
    protected: "{success}Protected."
    frozen: "{muted}Regeneration frozen for another {secondary}%time%{muted}."
    regenerating: "{muted}Protected again in {secondary}%time%{muted}."
    at-maximum: "{muted}At full DTR."
    # Its DTR would protect it, but EOTW or the Purge opens every team's claims.
    map-wide-raid: "{muted}Every team is raidable until EOTW or the Purge ends, whatever its DTR."

  death:
    lost: "{prefix}{error}%player% died. {muted}-%loss% DTR {muted}(now {secondary}%dtr%{muted})."

  announce:
    became-raidable: "{prefix}{error}&l%team% {error}is now RAIDABLE!"
    no-longer-raidable: "{prefix}{success}%team% {muted}is no longer raidable."

  set:
    success: "{success}DTR for {secondary}%team% {success}set to {secondary}%dtr%{success}."
    out-of-range: "{error}DTR must be between %min% and %max%."

  setregen:
    success: "{success}Regeneration for {secondary}%team% {success}resumes in {secondary}%seconds%s{success}."
    negative: "{error}The delay cannot be negative."

  error:
    disabled: "{error}The DTR system is disabled on this server."
    invalid-number: "{error}'%input%' is not a valid number."
    system-team: "{error}%team% is a server team and has no DTR."

# ---------------------------------------------------------------------------
# PvP / combat module
# ---------------------------------------------------------------------------
pvp:
  # Classic combat (config.yml, combat: classic; pvp.yml, legacy-combat).
  legacy:
    no-offhand: "{error}There is no off-hand in classic combat."
    no-shield: "{error}Shields do not work in classic combat - block with your sword."

  # The ender pearl cooldown (pvp.yml, ender-pearl-cooldown).
  pearl:
    cooldown: "{error}You cannot throw an ender pearl for {secondary}%time%{error}."
    blocks-teleport: "{error}You cannot teleport until your ender pearl cooldown is over ({secondary}%time% {error}left)."

  # Item cooldowns (pvp.yml, item-cooldowns). %item% is the item's name there.
  item-cooldown:
    refused: "{error}You cannot use %item% {error}for {secondary}%time%{error}."

  tag:
    tagged: "{error}You are now in combat for {secondary}%seconds%s{error}. You cannot teleport or log out safely."
    expired: "{success}You are no longer in combat."
    blocks-teleport: "{error}You cannot teleport while in combat ({secondary}%time% {error}left)."
    blocks-logout: "{error}You cannot log out while in combat ({secondary}%time% {error}left): leaving now would kill you."
    status-active: "{muted}Combat tag: {error}%time% {muted}remaining."
    status-clear: "{muted}Combat tag: {success}none{muted}."

  deathban:
    applied: "{error}You died. You cannot rejoin for {secondary}%time%{error}."
    login-denied: "{error}You are deathbanned for another {secondary}%time%{error}."
    lifted: "{success}Deathban lifted for {secondary}%player%{success}."
    not-banned: "{muted}%player% is not deathbanned."
    status: "{muted}Deathban: {error}%time% {muted}remaining."
    set: "{success}Deathbanned {secondary}%player% {success}for {secondary}%time%{success}."
    invalid-length: "{error}'%input%' is not a ban length: give a number of seconds above zero."
    # EOTW: a death bans until the end of the map; staff lift it after the reset.
    map-end:
      applied: "{error}You died during EOTW. You cannot rejoin until the end of the map."
      login-denied: "{error}You died during EOTW and are deathbanned until the end of the map."
      status: "{muted}Deathban: {error}until the end of the map{muted}."

  safezone:
    attacker: "{error}You cannot fight inside a safe zone."
    # pvp.yml, safe-zones.block-combat-tagged: spawn is closed while you are in combat.
    combat: "{error}You cannot enter a safe zone in combat {muted}- {secondary}%seconds%s {muted}left."

  # pvp.yml, friendly-fire
  friendly-fire:
    teammate: "{warning}You cannot hurt {success}%player%{warning}: they are on your team."
    ally: "{warning}You cannot hurt your ally {primary}%player% {warning}outside an event zone."

  status:
    header: "{muted}&m--------&r {secondary}Combat status - %player% {muted}&m--------"

  error:
    player-not-found: "{error}No player named '%player%' was found."
    invalid-number: "{error}'%input%' is not a valid number."
    disabled: "{error}The PvP module is disabled on this server."

# ---------------------------------------------------------------------------
# Economy module
# ---------------------------------------------------------------------------
economy:

  balance:
    self: "{muted}Balance: {success}%balance%"
    other: "{secondary}%player%{muted}'s balance: {success}%balance%"

  pay:
    sent: "{success}Sent {secondary}%amount% {success}to {secondary}%player%{success}. New balance: {secondary}%balance%{success}."
    received: "{success}Received {secondary}%amount% {success}from {secondary}%player%{success}. New balance: {secondary}%balance%{success}."
    disabled: "{error}Player-to-player payments are disabled on this server."
    self: "{error}You cannot pay yourself."
    below-minimum: "{error}The smallest payment allowed is {secondary}%minimum%{error}."

  admin:
    given: "{success}Gave {secondary}%amount% {success}to {secondary}%player%{success}. New balance: {secondary}%balance%{success}."
    taken: "{success}Took {secondary}%amount% {success}from {secondary}%player%{success}. New balance: {secondary}%balance%{success}."
    set: "{success}Set {secondary}%player%{success}'s balance to {secondary}%balance%{success}."
    received: "{muted}Your balance was changed by a staff member. New balance: {success}%balance%{muted}."

  bank:
    deposited: "{success}Deposited {secondary}%amount% {success}into {secondary}%team%{success}'s bank ({secondary}%bank%{success}). Your balance: {secondary}%balance%{success}."
    withdrawn: "{success}Withdrew {secondary}%amount% {success}from {secondary}%team%{success}'s bank ({secondary}%bank%{success}). Your balance: {secondary}%balance%{success}."

  error:
    insufficient-funds: "{error}You do not have enough money. Balance: {secondary}%balance%{error}."
    invalid-amount: "{error}That is not a valid amount."
    above-maximum: "{error}That would take the account over the maximum balance allowed."
    disabled: "{error}The economy is disabled on this server."
    player-not-found: "{error}No player named '%player%' was found."
    not-in-team: "{error}You are not in a team."

# ---------------------------------------------------------------------------
# Capture events (KOTH, Citadel and variants)
# ---------------------------------------------------------------------------
events:

  # Refused inside a Citadel's claim (events.yml, citadels: restrictions). Class
  # abilities - a Bard's buffs, an Archer's tag - are not partner items and work.
  citadel:
    no-pearls: "{error}Ender pearls do not work inside the Citadel."
    no-partner-items: "{error}Partner items do not work inside the Citadel - only class abilities do."
    no-chorus: "{error}Chorus fruit does not work inside the Citadel."
    no-elytra: "{error}Elytra do not work inside the Citadel."
    no-riptide: "{error}Riptide does not work inside the Citadel."

  # Above each capture zone (events.yml, zone-holograms), one line per key.
  hologram:
    title: "{primary}&l%event%"
    conquest-title: "{primary}&l%event% {muted}- {secondary}%zone%"
    time-left: "{muted}Time left: {secondary}%time%"
    held-by: "{muted}Held by {success}%team%"
    contested: "{error}Contested"
    free: "{muted}Nobody holds it"
    next: "{muted}Next: {secondary}%time%"
    unscheduled: "{muted}Not scheduled"
    # Above a DTC or Last Break's core.
    core-title: "{primary}&l%event%"
    core-health: "{muted}Health: {secondary}%health%{muted}/{secondary}%max%"
    core-leader: "{muted}Leads: {success}%team% {secondary}%breaks%{muted}/{secondary}%target%"
    core-nobody: "{muted}Nobody has broken it yet"
    # Above a Slide's zone.
    slide-title: "{primary}&l%event%"
    slide-top: "{muted}%rank%. {secondary}%team% {dark}{bullet} {primary}%points%"
    slide-nobody: "{muted}Nobody has scored yet"

  broadcast:
    started: "{prefix}{warning}%event% {primary}has started! {muted}Hold it for {secondary}%time% {muted}to win. {dark}(%zone%)"
    capture-began: "{prefix}{secondary}%team% {warning}is capturing {secondary}%event%{warning}. {muted}%time% {muted}remaining."
    contested: "{prefix}{error}%event% {muted}is contested - the countdown is frozen."
    control-lost: "{prefix}{muted}Nobody is holding {secondary}%event% {muted}any more. {dark}(%time% left)"
    progress: "{prefix}{warning}%event%{muted}: {secondary}%time% {muted}remaining, held by {secondary}%team%{muted}."
    captured: "{prefix}{success}%team% {primary}captured {warning}%event%{primary}!"
    expired: "{prefix}{muted}%event% {muted}ended with no winner."
    stopped: "{prefix}{muted}%event% {muted}has been stopped."

  list:
    header: "{muted}&m--------&r {secondary}Events {muted}&m--------"
    active: "{success}▶ {secondary}%event% {muted}- {secondary}%time% {muted}left, held by {secondary}%team%"
    contested: "{error}▶ {secondary}%event% {muted}- {secondary}%time% {muted}left, {error}contested"
    # Running, and nobody has taken the zone yet.
    free: "{success}▶ {secondary}%event% {muted}- {secondary}%time% {muted}left, {muted}nobody holds it"
    scheduled: "{muted}• {secondary}%event% {muted}- next at {secondary}%time%"
    unscheduled: "{dark}• {muted}%event% {dark}- no schedule"
    empty: "{muted}No events are configured."

  admin:
    started: "{success}Started {secondary}%event%{success}."
    stopped: "{success}Stopped {secondary}%event%{success}."

  error:
    unknown: "{error}There is no event called '%event%'."
    already-active: "{error}%event% is already running."
    not-active: "{error}%event% is not running."
    disabled: "{error}The events module is disabled on this server."

  # --- Conquest ------------------------------------------------------------
  # %event% is the Conquest's display name, %team% the team concerned.
  conquest:
    started: "{prefix}{primary}&l%event% {warning}has begun! {muted}Hold its {secondary}%zones% {muted}zones - the first team to {secondary}%points% {muted}points wins."
    zone-captured: "{prefix}{primary}%event% {dark}{bullet} {secondary}%team% {muted}captured %zone% {muted}(+%gained%) {dark}- {secondary}%points%{muted}/{secondary}%target%"
    points-lost: "{prefix}{primary}%event% {dark}{bullet} {secondary}%team% {error}lost %lost% point(s) {muted}to a death {dark}- {secondary}%points%{muted}/{secondary}%target%"
    won: "{prefix}{primary}&l%event% {warning}was won by {secondary}%team% {warning}with {secondary}%points% {warning}points!"
    expired: "{prefix}{primary}%event% {muted}ran out of time with no winner."
    stopped: "{prefix}{primary}%event% {muted}was stopped by staff."
    already-running: "{error}%event% is already running - one Conquest at a time."
    list-active: "{primary}▶ {secondary}%event% {muted}- {secondary}%team% {muted}leads with {secondary}%points%{muted}/{secondary}%target%"
    list-active-nobody: "{primary}▶ {secondary}%event% {muted}- nobody has scored yet {dark}(first to %target%)"

  # --- Kill the King -------------------------------------------------------
  # %king% is the King, %player% the winner, %event% the event's display name.
  king:
    crowned: "{prefix}{primary}%king% {warning}is the King in {secondary}%event%{warning}! {muted}Kill the King within {secondary}%time% {muted}- or the King wins."
    # In chat every announce-interval-seconds (events.yml); %health% is a percentage.
    coordinates: "{prefix}{primary}%king% {muted}is at {secondary}%x%{muted}, {secondary}%y%{muted}, {secondary}%z% {dark}(%world%) {muted}with {error}%health%% {muted}health - {secondary}%time% {muted}left"
    progress: "{prefix}{warning}%event%{muted}: {secondary}%king% {muted}has {secondary}%time% {muted}left to survive."
    survived: "{prefix}{primary}%king% {warning}survived {secondary}%event% {warning}and wins it!"
    killed: "{prefix}{error}%player% {warning}killed the King {primary}%king% {warning}and wins {secondary}%event%{warning}!"
    died: "{prefix}{muted}The King {secondary}%king% {muted}died in {secondary}%event% {muted}- no winner."
    fled: "{prefix}{muted}The King {secondary}%king% {muted}left the server - {secondary}%event% {muted}ends with no winner."
    stopped: "{prefix}{muted}%event% {muted}has been stopped."
    cancelled:
      not-enough-players: "{prefix}{muted}%event% {muted}is called off: it needs at least {secondary}%minimum% {muted}players."
      no-warzone: "{prefix}{muted}%event% {muted}is called off: its world has no warzone."
      no-spot: "{prefix}{muted}%event% {muted}is called off: no safe spot was found in the warzone."
      teleport-failed: "{prefix}{muted}%event% {muted}is called off: the King could not be sent to the warzone."
    you-are-king: "{primary}You are the King! {muted}Survive {secondary}%time% {muted}in the warzone. Your items are safe and come back at the end."
    left-zone: "{error}You left the warzone! {muted}Go back within {secondary}%grace%s{muted}, or you will wither."
    returned: "{success}Back in the warzone."
    safe-zone-refused: "{error}The King cannot enter a safe zone."
    not-while-king: "{error}Not while you are the King - the kit stays with you."
    items-returned: "{success}Your own items are back."
    already-running: "{error}%event% is already running - only one King at a time."
    list:
      active: "{primary}♛ {secondary}%event% {muted}- {secondary}%king% {muted}reigns, {secondary}%time% {muted}left"
      crowning: "{primary}♛ {secondary}%event% {muted}- drawing the King..."

  # --- DTC and Last Break share one run slot (one engine, CoreEventManager):
  # only one of the two runs at a time. This message names whichever of the
  # two is actually running - never "one DTC at a time" for a Last Break, or
  # the reverse.
  core:
    already-running: "{error}A core event is already running: {secondary}%event% {error}({muted}DTC or Last Break - only one at a time{error})."

  # --- DTC (Destroy The Core) ----------------------------------------------
  # %event% the DTC's display name, %team% the team concerned.
  dtc:
    started: "{prefix}{primary}&l%event% {warning}has begun! {muted}Break the core - {secondary}%target% {muted}health, most breaks of its own wins."
    started-per-team: "{prefix}{primary}&l%event% {warning}has begun! {muted}First team to {secondary}%target% {muted}breaks of its own wins."
    milestone: "{prefix}{primary}%event% {dark}{bullet} {muted}the core has {secondary}%remaining%{muted}/{secondary}%total% {muted}health left."
    milestone-per-team: "{prefix}{primary}%event% {dark}{bullet} {secondary}%team% {muted}has {secondary}%remaining% {muted}breaks left to win."
    won: "{prefix}{primary}&l%event% {warning}was won by {secondary}%team% {warning}with {secondary}%breaks% {warning}breaks!"
    expired: "{prefix}{primary}%event% {muted}ran out of time with no winner."
    stopped: "{prefix}{primary}%event% {muted}was stopped by staff."
    cooldown: "{error}Your team must wait {secondary}%time%s {error}before breaking the core again."
    no-team: "{error}You cannot break the core right now."
    list-active: "{primary}▶ {secondary}%event% {muted}- {secondary}%health%{muted}/{secondary}%max% {muted}health left"
    list-active-per-team: "{primary}▶ {secondary}%event% {muted}- {secondary}%team% {muted}leads with {secondary}%breaks%{muted}/{secondary}%target% {muted}breaks"
    list-active-nobody: "{primary}▶ {secondary}%event% {muted}- nobody has broken it yet {dark}(first to %target%)"

  # --- Last Break ------------------------------------------------------------
  last-break:
    started: "{prefix}{error}&l%event% {warning}has begun! {muted}Whoever lands the last hit on the core - {secondary}%target% {muted}health - wins."
    milestone: "{prefix}{error}%event% {dark}{bullet} {muted}the core has {secondary}%remaining%{muted}/{secondary}%total% {muted}health left."
    won: "{prefix}{error}&l%event% {warning}was won by {secondary}%team%{warning}: the last break was theirs!"
    expired: "{prefix}{error}%event% {muted}ran out of time with no winner."
    stopped: "{prefix}{error}%event% {muted}was stopped by staff."
    cooldown: "{error}Your team must wait {secondary}%time%s {error}before breaking the core again."
    no-team: "{error}You cannot break the core right now."
    list-active: "{primary}▶ {secondary}%event% {muted}- {secondary}%health%{muted}/{secondary}%max% {muted}health left"
    list-active-nobody: "{primary}▶ {secondary}%event% {muted}- nobody has broken it yet {dark}(first to %target%)"

  # --- Slide -----------------------------------------------------------------
  # %event% the Slide's display name, %team% the team concerned.
  slide:
    started: "{prefix}{success}&l%event% {warning}has begun! {muted}Stand in the zone to score - the first team to {secondary}%target% {muted}points wins."
    milestone: "{prefix}{success}%event% {dark}{bullet} {secondary}%team% {muted}reached {secondary}%points%{muted}/{secondary}%target% {muted}points."
    points-lost: "{prefix}{success}%event% {dark}{bullet} {secondary}%team% {error}lost %lost% point(s) {muted}to a death {dark}- {secondary}%points%{muted}/{secondary}%target%"
    won: "{prefix}{success}&l%event% {warning}was won by {secondary}%team% {warning}with {secondary}%points% {warning}points!"
    expired: "{prefix}{success}%event% {muted}ran out of time with no winner."
    stopped: "{prefix}{success}%event% {muted}was stopped by staff."
    already-running: "{error}%event% is already running - one Slide at a time."
    list-active: "{primary}▶ {secondary}%event% {muted}- {secondary}%team% {muted}leads with {secondary}%points%{muted}/{secondary}%target%"
    list-active-nobody: "{primary}▶ {secondary}%event% {muted}- nobody has scored yet {dark}(first to %target%)"

  # --- Totem and Mini Totem ------------------------------------------------
  # %height% is the column's height, %broken% how many of its blocks the team on
  # its way has broken, %previous% the team whose progress a reset wiped out.
  totem:
    started: "{prefix}{warning}&l%event% {warning}has begun! {muted}Break all {secondary}%height% {muted}blocks of the column with a sword - another team's break starts it over."
    broken: "{prefix}{warning}%event% {dark}{bullet} {secondary}%team% {muted}broke {secondary}%broken%{muted}/{secondary}%height%"
    reset: "{prefix}{warning}%event% {dark}{bullet} {secondary}%team% {error}broke a block{muted}: {secondary}%previous%{muted}'s progress is gone, the totem starts over."
    won: "{prefix}{warning}&l%event% {warning}was won by {secondary}%team%{warning}!"
    expired: "{prefix}{warning}%event% {muted}ran out of time with no winner."
    stopped: "{prefix}{warning}%event% {muted}was stopped by staff."
    already-running: "{error}%event% is already running - one Totem at a time."
    no-team: "{error}You need a team to break the totem."
    wrong-tool: "{error}The totem is broken with a sword."
    list-active: "{primary}▶ {secondary}%event% {muted}- {secondary}%team% {muted}has broken {secondary}%broken%{muted}/{secondary}%height%"
    list-active-nobody: "{primary}▶ {secondary}%event% {muted}- untouched {dark}(%height% blocks)"
    list-idle: "{muted}%event%"
    # Above the column.
    hologram-title: "{warning}&l%event%"
    hologram-progress: "{muted}%team% {dark}{bullet} {secondary}%broken%{muted}/{secondary}%height%"
    hologram-nobody: "{muted}Untouched {dark}(%height% blocks)"

  # /events create|info|claim|unclaim|setzone|delzone|setblock|delete - the same
  # verbs for every kind of event (docs/gameplay/events.md, "Setting up an event").
  setup:
    usage: "{error}Usage: {secondary}%usage%"
    in-game-only: "{error}That needs a position - run it in game."
    write-failed: "{error}Could not read or write events.yml - see the console."
    invalid-id: "{error}'%id%' is not a valid id {muted}- use only lowercase letters, digits, '_' and '-' ({secondary}%min%{muted}-{secondary}%max% {muted}characters)."
    unknown-id: "{error}There is no event called '%event%' in events.yml."
    running: "{error}%event% is running - stop it first with {secondary}/events stop %event%{error}."
    no-wand: "{error}Territories and zones are drawn with the claiming wand, which needs the claim module running."
    # --- create / delete
    unknown-type: "{error}'%type%' is not a kind of event {muted}- one of: {secondary}%types%"
    already-exists: "{error}An event called '%event%' already exists."
    no-template: "{error}The plugin jar has no example %type% to copy - see the console."
    created: "{success}Created the %type% {secondary}%event% {success}where you stand."
    auto-claimed: "{success}Its territory is claimed {muted}- {secondary}%size% {muted}for the server team {secondary}%team%{muted}. Redraw it with {secondary}/events claim %event%{muted}."
    auto-claim-refused: "{warning}Its territory could not be claimed here: {muted}%reason% {warning}Draw it with {secondary}/events claim %event%{warning}."
    deleted: "{success}Deleted {secondary}%event%{success}."
    deleted-territory: "{success}Its territory is released {muted}(server team {secondary}%team% {muted}disbanded)."
    # --- territory: /events claim|unclaim
    territory-not-applicable: "{error}%event% is fought in the warzone - it has no territory to claim."
    territory-team-created: "{muted}Server team {secondary}%team% {muted}created for the territory of {secondary}%event%{muted} (combat zone)."
    territory-name-taken: "{error}A player team is called {secondary}%team%{error} - set another server team in the {secondary}claim{error} key of %event% in events.yml."
    territory-team-failed: "{error}No server team could be made for %event%: {muted}%reason%"
    territory-none: "{error}%event% has no territory yet {muted}- {secondary}/events claim %event%"
    unclaimed: "{success}Released {secondary}%claim% {success}from the territory of {secondary}%event%{success}."
    unclaimed-all: "{success}Released all {secondary}%count% {success}claims of {secondary}%event% {muted}(server team %team%)."
    # --- zones: /events setzone|delzone
    zone-not-applicable: "{error}%event% is fought in the warzone - it has no zone to draw."
    zone-name-needed: "{error}%event% has several zones: {secondary}/events setzone %event% <zone> {muted}- a new name adds one. Zones: {secondary}%zones%"
    zone-only-one: "{error}%event% has a single zone: {secondary}/events setzone %event%"
    zone-invalid-name: "{error}'%zone%' is not a valid zone name {muted}- lowercase letters, digits, '_' and '-'."
    zone-unknown: "{error}%event% has no zone '%zone%'. {muted}Zones: {secondary}%zones%"
    zone-last: "{error}That is the last zone of %event% - draw another before deleting it."
    # %from% and %to% are the zone's heights: from the lower corner to
    # setup.zone-height blocks above the higher one.
    zone-preview: "{muted}Zone of {secondary}%event% {dark}{bullet} {secondary}%size%{muted}, heights {secondary}%from% {muted}to {secondary}%to%"
    zone-preview-outside: "{warning}Part of it is outside the territory of %event%."
    zone-drawn: "{success}Zone of {secondary}%event% {success}drawn: {secondary}%size%{success}."
    zone-outside-territory: "{warning}Part of that zone is outside the territory of %event% {muted}- widen it with {secondary}/events claim %event%{muted}."
    zone-deleted: "{success}Zone {secondary}%zone% {success}of {secondary}%event% {success}deleted."
    # --- /events setblock
    block-not-applicable: "{error}%event% has no block to place {muted}- only a DTC, Last Break or Totem has one."
    no-target: "{error}You are not looking at a block close enough."
    block-outside-zone: "{error}That is outside the zone of %event% {muted}- move the zone first with {secondary}/events setzone %event%{muted}."
    core-set: "{success}The core of {secondary}%event% {success}is now the block you were looking at."
    column-set: "{success}The column of {secondary}%event% {muted}({secondary}%height% {muted}blocks) {success}now stands on the block you were looking at."
    not-loaded: "{error}%event% did not load - see the console for what is wrong with it in events.yml."
    # --- /events info <id>: the checklist
    info:
      header: "{muted}&m------&r %name% {muted}({secondary}%type%{muted}, id {secondary}%event%{muted}) &m------"
      not-loaded: "{error}✘ {muted}Not loaded - see the console for what is wrong with it in events.yml."
      territory: "{success}✔ {muted}Territory: {secondary}%team% {muted}- %claims% claim(s), %area% blocks {dark}{bullet} {secondary}/events claim %event%"
      territory-empty: "{error}✘ {muted}Territory: the server team {secondary}%team% {muted}has no land {dark}{bullet} {secondary}/events claim %event%"
      territory-none: "{error}✘ {muted}No territory {dark}{bullet} {secondary}/events claim %event%"
      zone: "{success}✔ {muted}Zone: {secondary}%size% {muted}around {secondary}%at%{muted}, heights %from% to %to% {dark}{bullet} {secondary}/events setzone %event%"
      zone-named: "{success}✔ {muted}Zone {secondary}%zone%{muted}: {secondary}%size% {muted}around {secondary}%at%{muted}, heights %from% to %to% {dark}{bullet} {secondary}/events setzone %event% %zone%"
      zone-outside: "{warning}! {muted}Zone {secondary}%zone% {muted}is not all inside the territory {dark}{bullet} {secondary}/events claim %event%"
      no-zone: "{error}✘ {muted}No zone {dark}{bullet} {secondary}/events setzone %event%"
      warzone: "{success}✔ {muted}Fought in the warzone of {secondary}%world%"
      no-warzone: "{error}✘ {muted}{secondary}%world% {muted}has no warzone - set one in claims.yml (warzone.worlds)"
      core: "{success}✔ {muted}Core: {secondary}%material% {muted}at {secondary}%x% %y% %z% {dark}{bullet} {secondary}/events setblock %event%"
      column: "{success}✔ {muted}Column: {secondary}%height% {muted}blocks on {secondary}%x% %y% %z% {dark}{bullet} {secondary}/events setblock %event%"
      column-missing: "{warning}! {muted}Column not built at {secondary}%x% %y% %z% {dark}{bullet} {muted}look at its base: {secondary}/events setblock %event%"
      schedule: "{success}✔ {muted}Opens by itself at {secondary}%times%"
      schedule-none: "{muted}• No schedule - only {secondary}/events start %event% {muted}opens it (schedule: in events.yml)."
      running: "{success}▶ Running now {dark}{bullet} {secondary}/events stop %event%"
      idle: "{muted}• Not running {dark}{bullet} {secondary}/events start %event%"

  # /schedule and the weekly schedule (events.yml, weekly-schedule).
  planning:
    header: "{muted}&m------&r {primary}Event schedule {muted}&m------"
    # %day% is today, tomorrow or a day's name below; %date% is written with
    # date-format (Java DateTimeFormatter letters: dd day, MM month).
    day: "{secondary}%day% {dark}{bullet} {muted}%date%"
    today: "Today"
    tomorrow: "Tomorrow"
    date-format: "dd/MM"
    entry: "  {muted}%time% {dark}- %event%"
    empty: "{muted}No event is planned in the next seven days."
    disabled: "{warning}The weekly schedule is off {muted}(events.yml, weekly-schedule) - only the events' daily times run."
    soon: "{prefix}%event% {muted}starts in {secondary}%time%{muted}."
    # /schedule as a window (events.yml, weekly-schedule.menu): one item per day.
    menu-title: "Event schedule"
    menu-day: "%day% {muted}%date% {dark}(%count%)"
    menu-entry: "{muted}%time% {dark}{bullet} %event%"
    menu-day-empty: "{dark}Nothing planned"
    usage: "{error}Usage: {secondary}/schedule {muted}| {secondary}/schedule add <day> <HH:mm> <event> {muted}| {secondary}/schedule remove <day> <HH:mm> [event]"
    invalid-day: "{error}'%day%' is not a day of the week."
    invalid-time: "{error}'%time%' is not a time {muted}- HH:mm, like 18:00."
    unknown-event: "{error}There is no event called '%event%'."
    added: "{success}%event% {success}now starts every {secondary}%day% {success}at {secondary}%time%{success}."
    already-planned: "{error}%event% already starts on %day% at %time%."
    removed: "{success}Removed {secondary}%count% {success}start(s) on {secondary}%day% {success}at {secondary}%time%{success}."
    not-planned: "{error}Nothing is planned on %day% at %time%."
    write-failed: "{error}Could not read or write events.yml - see the console."
    days:
      monday: "Monday"
      tuesday: "Tuesday"
      wednesday: "Wednesday"
      thursday: "Thursday"
      friday: "Friday"
      saturday: "Saturday"
      sunday: "Sunday"

# ---------------------------------------------------------------------------
# Resource nodes (Mountain / Glowstone Mountain / Ore Mountain)
# ---------------------------------------------------------------------------
resourcenode:

  broadcast:
    soon: "{prefix}{warning}%node% {muted}refills in {secondary}%time%{muted}."
    refilled: "{prefix}{primary}%node% {warning}has just refilled! {muted}(%world%)"

  list:
    header: "{muted}&m------&r {secondary}Resource nodes {muted}&m------"
    scheduled: "{muted}• {secondary}%node% {muted}- next refill at {secondary}%time%"
    unscheduled: "{dark}• {muted}%node% {dark}- no schedule"
    refilling: "{success}▶ {secondary}%node% {muted}- refilling now"
    empty: "{muted}No resource node is configured."

  admin:
    refilling: "{success}Refilling {secondary}%node%{success}."
    busy: "{error}%node% is already being refilled."

  protection:
    no-build: "{error}You cannot build inside %node%."
    no-break: "{error}Only the resources that spawn here can be mined in %node%."

  error:
    unknown: "{error}There is no resource node called '%node%'."
    disabled: "{error}The resource node module is disabled on this server."
    world-missing: "{error}Cannot refill %node%{error}: the world '%world%' is not loaded."
    outside-world: "{error}Cannot refill %node%{error}: its region is outside the height range of '%world%'."

# ---------------------------------------------------------------------------
# SOTW / EOTW - the start and the end of the map
# ---------------------------------------------------------------------------
phase:

  sotw:
    started: "{prefix}{success}SOTW has started! {muted}No PvP, no deathbans and no DTR lost for {secondary}%time%{muted}. {dark}(/sotw enable to fight early)"
    progress: "{prefix}{success}SOTW {muted}ends in {secondary}%time%{muted}."
    ended: "{prefix}{error}SOTW is over {muted}- PvP, deathbans and DTR are back. Good luck."
    stopped: "{prefix}{error}SOTW was ended by staff {muted}- PvP, deathbans and DTR are back."
    you-are-protected: "{muted}You are protected by SOTW. {secondary}/sotw enable {muted}to fight - there is no going back."
    victim-protected: "{muted}That player is protected by SOTW."
    enabled: "{error}PvP enabled for you {muted}until SOTW ends - only against players who did the same. This cannot be undone."
    already-enabled: "{muted}You have already enabled PvP for this SOTW."
    not-active: "{muted}SOTW is not running."
    already-active: "{error}SOTW is already running {muted}({secondary}%time% {muted}left)."
    during-eotw: "{error}Not during EOTW."
    status:
      active: "{success}SOTW{muted}: {secondary}%time% {muted}left."
      protected: "{muted}You are protected. {secondary}/sotw enable {muted}to fight."
      enabled: "{muted}You have enabled PvP for this SOTW."
      scheduled: "{muted}SOTW starts at {secondary}%time%{muted}."
      inactive: "{muted}SOTW is not running."

  eotw:
    started: "{prefix}{error}EOTW has begun! {error}Every team is raidable, claiming is closed, and a death bans you until the end of the map."
    stopped: "{prefix}{muted}EOTW has been stopped by staff."
    no-claims: "{error}Claiming is closed: EOTW is under way."
    already-active: "{error}EOTW is already under way."
    not-active: "{muted}EOTW is not under way."
    during-sotw: "{error}Not during SOTW - stop it first."
    status:
      active: "{error}EOTW {error}is under way {muted}- every team is raidable, and a death bans until the end of the map."
      scheduled: "{muted}EOTW starts at {secondary}%time%{muted}."
      inactive: "{muted}EOTW is not under way."

  purge:
    started: "{prefix}{error}&lTHE PURGE HAS BEGUN! {error}Every team is raidable for {secondary}%time%{error}, whatever its DTR."
    ended: "{prefix}{success}The Purge is over {muted}- teams are protected by their DTR again."
    stopped: "{prefix}{muted}The Purge was ended by staff {muted}- teams are protected by their DTR again."
    already-active: "{error}A Purge is already running {muted}({secondary}%time% {muted}left)."
    not-active: "{muted}No Purge is running."
    during-sotw: "{error}Not during SOTW."
    during-eotw: "{error}Not during EOTW - every team is raidable already."
    status:
      active: "{error}Purge{muted}: every team is raidable for {secondary}%time%{muted}."
      scheduled: "{muted}The next Purge starts at {secondary}%time%{muted}."
      inactive: "{muted}No Purge is running or scheduled."

  error:
    invalid-duration: "{error}'%input%' is not a duration. {muted}Try {secondary}2h{muted}, {secondary}90m {muted}or {secondary}1h30m{muted}."

  # Lines in /events
  agenda:
    sotw-active: "{success}▶ {secondary}SOTW {muted}- {secondary}%time% {muted}left"
    sotw-scheduled: "{muted}• {secondary}SOTW {muted}- starts at {secondary}%time%"
    eotw-active: "{error}▶ {secondary}EOTW {muted}- under way"
    purge-active: "{error}▶ {secondary}Purge {muted}- {secondary}%time% {muted}left, every team raidable"
    purge-scheduled: "{muted}• {secondary}Purge {muted}- starts at {secondary}%time%"
    eotw-scheduled: "{muted}• {secondary}EOTW {muted}- starts at {secondary}%time%"

# ---------------------------------------------------------------------------
# Staff tools
# ---------------------------------------------------------------------------
staff:
  # staff.yml, mining-alerts: a player broke into a vein of a reported ore.
  # "found" is the public line (audience: everyone) and never gives the position;
  # "found-staff" is what staff and the console read.
  mining:
    found: "{dark}[{secondary}FD{dark}] {secondary}%player% {muted}found {secondary}%count% %ore%{muted}."
    found-staff: "{dark}[{secondary}FD{dark}] {secondary}%player% {muted}found {secondary}%count% %ore% {dark}{bullet} {muted}%world% %x% %y% %z%"
  mode:
    entered: "{success}Staff mode on{muted}. Your items are held safely until you leave it."
    left: "{muted}Staff mode off. Your items are back."
    announce-entered: "{dark}[{primary}Staff{dark}] {secondary}%player% {muted}entered staff mode."
    announce-left: "{dark}[{primary}Staff{dark}] {secondary}%player% {muted}left staff mode."
    # Refused rather than overwrite: the held inventory is the real one.
    already-held: "{error}Your items from an earlier session are still held. {muted}Rejoin the server to get them back before using staff mode."
    stash-restored: "{success}Your items have been given back{muted} - the server stopped while you were in staff mode."
    # Their inventory stays held in the database; the next login tries again.
    restore-failed: "{error}Your items could not be given back. {muted}They are kept safe and will be given back when you rejoin; the error is in the server log."
    item-needs-target: "{error}Right-click a player with that item."
    list-header: "{primary}Staff mode {muted}({secondary}%count%{muted}):"
    list-entry: "{muted}- {secondary}%player%"
    list-empty: "{muted}Nobody is in staff mode."

  # "enabled"/"disabled" and not "on"/"off": YAML reads a bare on/off/yes/no as a
  # boolean, so `on:` would become the key `true` and the message would never be
  # found. Keep them spelled out.
  vanish:
    enabled: "{success}You are now hidden{muted} from players who cannot see vanished staff."
    disabled: "{muted}You are visible again."

  chat:
    enabled: "{success}Staff chat on{muted} - what you type goes to the staff channel."
    disabled: "{muted}Staff chat off."

  build:
    enabled: "{success}Staff build on{muted} - you can build through territory protection."
    # Toggled on by staff who lack hcfcore.claim.bypass: the toggle alone lifts nothing.
    enabled-without-bypass: "{warning}Staff build on{muted}, but you do not hold {secondary}hcfcore.claim.bypass{muted}: territory protection still applies to you."
    disabled: "{muted}Staff build off."

  teleport:
    to-player: "{muted}Teleported to {secondary}%player%{muted}."
    player-here: "{muted}Teleported {secondary}%player% {muted}to you."
    all: "{muted}Teleported {secondary}%count% {muted}player(s) to you."
    location: "{muted}Teleported to {secondary}%x%{muted}, {secondary}%y%{muted}, {secondary}%z% {muted}in {secondary}%world%{muted}."
    nobody-else: "{error}There is nobody else online."
    location-told: "{secondary}%player% {muted}is at {secondary}%x%{muted}, {secondary}%y%{muted}, {secondary}%z% {muted}in {secondary}%world%{muted}."

  near:
    header: "{primary}%count% player(s) {muted}within {secondary}%radius% {muted}blocks:"
    entry: "{muted}- {secondary}%player% {muted}({secondary}%distance%{muted} block(s))"
    empty: "{muted}Nobody within {secondary}%radius% {muted}blocks."

  dimension:
    header: "{primary}%dimension% {muted}({secondary}%count%{muted}):"
    entry: "{muted}- {secondary}%player%"
    empty: "{muted}Nobody is in {secondary}%dimension%{muted}."
    missing: "{error}There is no world named '%world%'."

  chat-cleared: "{dark}[{primary}Staff{dark}] {secondary}%player% {muted}cleared the chat."

  error:
    player-not-found: "{error}'%player%' is not online."
    invalid-number: "{error}'%input%' is not a number."
    disabled: "{error}The staff module is disabled."
    usage: "{error}Usage: {secondary}%usage%"

  # Freeze, and the ban that follows running from one
  freeze:
    applied: "{success}You froze {secondary}%player%{muted}."
    released: "{muted}You released {secondary}%player%{muted}."
    target-frozen: "{error}&lYOU HAVE BEEN FROZEN {muted}by {secondary}%player%{muted}. {secondary}Do not log out - leaving now results in a ban. Talk to them in chat."
    target-released: "{success}You have been released{muted}. Thanks for waiting."
    reminder: "{error}&lFROZEN {muted}- stay here and talk to {secondary}%player%{muted}. Logging out results in a ban."
    blocked: "{error}You cannot do that while frozen."
    already-held: "{error}%player% is already frozen by {secondary}%holder%{muted}."
    list-header: "{primary}Frozen {muted}({secondary}%count%{muted}):"
    list-entry: "{muted}- {secondary}%player% {muted}(held by {secondary}%holder%{muted})"
    list-empty: "{muted}Nobody is frozen."
    logout-announce: "{dark}[{primary}Staff{dark}] {error}%player% logged out while frozen {muted}and has been banned."

  ban:
    login-denied: "{error}You were banned for logging out while frozen.{muted} Appeal with the staff team."
    lifted: "{success}Lifted the ban on {secondary}%player%{muted}."
    not-banned: "{error}%player% is not banned."
    reason-frozen-logout: "logged out while frozen"

  invsee:
    opened: "{muted}Viewing {secondary}%player%{muted}'s inventory."
    read-only: "{muted}This view is {secondary}read-only{muted}."
    editable: "{error}&lEDITABLE {muted}- what you change here changes their real inventory."
    armour: "{muted}Armour: {secondary}%armour% {muted}| Off-hand: {secondary}%offhand%"
    self: "{error}Open your own inventory the usual way."

  lastinv:
    header: "{primary}%player%{muted}'s last deaths ({secondary}%count%{muted}):"
    entry: "{muted}[{secondary}%index%{muted}] {secondary}%when% {muted}ago"
    empty: "{muted}No recorded deaths for {secondary}%player%{muted}."
    opened: "{muted}Viewing {secondary}%player%{muted}'s inventory from {secondary}%when% {muted}ago. {secondary}Read-only{muted}."
    # The title of the window; %index% is the death's number in the list.
    view-title: "%player% - death %index%"
    out-of-range: "{error}There is no death number %index% for %player%."
    unreadable: "{error}That snapshot could not be read; it is kept in the database."
    lookup-failed: "{error}Could not read the death archive. See the console."

  # Reports and requests - one queue, see staff.yml
  ticket:
    opened: "{success}Submitted{muted}. Ticket {secondary}#%id%{muted} - staff have been notified."
    announce: "{dark}[{primary}Staff{dark}] {secondary}#%id% {muted}%type% from {secondary}%player% {muted}about {secondary}%target%{muted}: {secondary}%message%"
    # A request is about nobody, so its lines have no %target%.
    announce-request: "{dark}[{primary}Staff{dark}] {secondary}#%id% {muted}%type% from {secondary}%player%{muted}: {secondary}%message%"
    too-soon: "{error}You must wait {secondary}%time% {error}before sending another."
    self: "{error}You cannot report yourself."
    list-header: "{primary}Tickets {muted}({secondary}%count%{muted}):"
    list-entry: "{muted}#{secondary}%id% {muted}[{secondary}%status%{muted}] {secondary}%type% {muted}from {secondary}%player% {muted}about {secondary}%target% {muted}({secondary}%age% {muted}ago): {secondary}%message%"
    list-entry-request: "{muted}#{secondary}%id% {muted}[{secondary}%status%{muted}] {secondary}%type% {muted}from {secondary}%player% {muted}({secondary}%age% {muted}ago): {secondary}%message%"
    list-empty: "{muted}Nothing in the queue."
    claimed: "{success}Ticket {secondary}#%id% {success}is yours."
    already-claimed: "{error}Ticket #%id% is not open - somebody may already have it."
    closed: "{muted}Closed ticket {secondary}#%id%{muted}."
    unknown: "{error}There is no open ticket #%id%."
    nobody-to-visit: "{error}Nobody on ticket #%id% is online to teleport to."
    # Sent to whoever raised the ticket, if they are online. No staff name: the
    # staff member may be vanished and watching the player who was reported.
    notify-claimed: "{success}A staff member is looking at your ticket {secondary}#%id%{success}."
    notify-closed: "{muted}Your ticket {secondary}#%id% {muted}has been closed."
    menu:
      title: "{primary}&lTickets {dark}({secondary}%count%{dark})"
      report-name: "{error}#%id% {secondary}Report {muted}- {secondary}%target%"
      request-name: "{warning}#%id% {secondary}Request {muted}- {secondary}%player%"
      from: "{muted}From: {secondary}%player%"
      about: "{muted}About: {secondary}%target%"
      status: "{muted}Status: {secondary}%status%"
      age: "{muted}Opened {secondary}%age% {muted}ago"
      message-line: "{secondary}%line%"
      left-click: "{secondary}{action}Left-click {muted}to claim it and teleport"
      right-click: "{secondary}{action}Right-click {muted}to close it"

  # Strikes against teams (staff.yml, strikes).
  strike:
    issued: "{muted}Struck {error}%team% {muted}for {secondary}%offence% {muted}(-{secondary}%percent%% {muted}points) - {secondary}%count% {muted}active ({secondary}#%id%{muted})."
    # To staff only - nothing about a strike is said in the general chat; the team's
    # members are told when it disbands them. %max% is "/3" when a count disbands.
    announce: "{dark}[{primary}Staff{dark}] {secondary}%staff% {muted}struck {error}%team%%subject% {muted}for {secondary}%offence% {dark}({secondary}%count%%max%{dark})%details%"
    points-lost: "{dark}[{primary}Staff{dark}] {error}%team% {muted}lost {secondary}%points% {muted}point(s)."
    disbanded: "{dark}[{primary}Staff{dark}] {error}%team% {muted}has been disbanded after {secondary}%count% {muted}strikes."
    disband-refused: "{error}The strike is recorded, but %team% could not be disbanded - another plugin refused it."
    # Appended after the team where a strike was for a member.
    subject: " {muted}(for {secondary}%player%{muted})"
    list-header: "{primary}Strikes {muted}for {error}%team% {muted}({secondary}%active% {muted}active of {secondary}%total%{muted}):"
    # What each strike was for; %details% - what staff added - only for staff.
    list-entry: "{muted}#{secondary}%id% {muted}[{secondary}%state%{muted}] {secondary}%offence%%subject%%details% {muted}- {secondary}%age% {muted}ago"
    # Appended where staff added details, for staff only.
    details: "{muted}: {secondary}%details%"
    offences-header: "{primary}Offences {muted}- a team is disbanded at {secondary}%disband% {muted}active strikes:"
    offences-entry: "{muted}- {secondary}%id% {dark}({muted}%name%{dark}) {muted}- {error}-%percent%% {muted}points"
    unknown-offence: "{error}No offence called '%input%'. {muted}Offences: {secondary}%offences%"
    none: "{muted}%team% has no strikes."
    pardoned: "{muted}Pardoned strike {secondary}#%id%{muted}. Points taken, and a disband, are not given back."
    unknown: "{error}There is no strike #%id%."
    unknown-team: "{error}There is no team or player called '%team%'."
    no-team: "{error}%player% is not in a team."
    system-team: "{error}Server teams cannot be struck."

# ---------------------------------------------------------------------------
# Player statistics
# ---------------------------------------------------------------------------
stats:
  header: "{primary}Stats {muted}- {secondary}%player%"
  kills: "{muted}Kills: {secondary}%value%"
  deaths: "{muted}Deaths: {secondary}%value%"
  ratio: "{muted}K/D: {secondary}%value%"
  killstreak: "{muted}Killstreak: {secondary}%value% {muted}(best {secondary}%best%{muted})"
  playtime: "{muted}Playtime: {secondary}%value%"
  first-seen: "{muted}First seen: {secondary}%value% {muted}ago"
  unknown-player: "{error}No statistics for '%player%'."

  top:
    header: "{primary}Top 10 {muted}- {secondary}%kind%"
    entry: "{muted}%rank%. {secondary}%player% {muted}- {secondary}%value%"
    empty: "{muted}Nobody has any statistics yet."
    usage: "{error}Unknown leaderboard. {muted}Try: {secondary}%kinds%"

# ---------------------------------------------------------------------------
# Scoreboard wording
# ---------------------------------------------------------------------------
ui:
  scoreboard:
    no-team: "{muted}None"
    dtr-raidable: "{error}(raidable)"
    combat-line: "{primary}Combat {dark}{bullet} {error}%time%"
    pearl-line: "{primary}Enderpearl {dark}{bullet} {warning}%time%"
    # An item cooldown of pvp.yml: %item% is its name there.
    item-cooldown-line: "%item% {dark}{bullet} {warning}%time%"
    # %target% is a player's or a team's name; the rally row gives block coordinates.
    focus-line: "{primary}Focus {dark}{bullet} {secondary}%target%"
    rally-line: "{primary}Rally {dark}{bullet} {secondary}%x%, %y%, %z%"
    phase-sotw: "{success}SOTW {dark}{bullet} {secondary}%time%"
    phase-eotw: "{error}EOTW {dark}{bullet} {secondary}active"
    phase-purge: "{error}Purge {dark}{bullet} {secondary}%time%"
    # The running KOTH or Citadel closest to being captured; %event% carries its own colours.
    event-line: "%event% {dark}{bullet} {secondary}%time%"
    king-line: "{primary}King {secondary}%player% {dark}{bullet} {secondary}%time%"
    king-location-line: "{primary}At {dark}{bullet} {secondary}%x%{muted}, {secondary}%y%{muted}, {secondary}%z%"
    # The running Conquest: the leading team, then one row per zone.
    conquest-line: "%event% {dark}{bullet} {secondary}%team% %points%{muted}/{secondary}%target%"
    conquest-zone: "%zone% {dark}{bullet} {secondary}%time%"
    # The running DTC - SHARED (common health) or PER_TEAM (the leader's own breaks).
    dtc-line: "%event% {dark}{bullet} {secondary}%health%{muted}/{secondary}%max%"
    dtc-line-per-team: "%event% {dark}{bullet} {secondary}%team% %breaks%{muted}/{secondary}%target%"
    # Your own team's breaks in the running DTC, empty without a team or a run.
    dtc-team-line: "{muted}Your breaks {dark}{bullet} {secondary}%breaks%"
    last-break-line: "%event% {dark}{bullet} {secondary}%health%{muted}/{secondary}%max%"
    # The running Slide's leader, then the live top 3 (%slide_top_1% to %slide_top_3%).
    slide-line: "%event% {dark}{bullet} {secondary}%team% %points%{muted}/{secondary}%target%"
    totem-line: "%event% {dark}{bullet} {secondary}%team% %broken%{muted}/{secondary}%height%"
    totem-line-nobody: "%event% {dark}{bullet} {muted}0/%height%"
    slide-top: "{muted}%rank%. {secondary}%team% {dark}{bullet} {primary}%points%"
    # One custom timer (/timer, /keyall); %label% is its label, colours included.
    timer-line: "%label% {dark}{bullet} {secondary}%time%"
  # The tab list (ui.yml, tablist).
  tab:
    # %location% outside any claim; inside one, the claim's team name.
    wilderness: "{success}Wilderness"
    claim: "{warning}%team%"
    # %direction%, clockwise from north: eight words, comma-separated.
    directions: "N,NE,E,SE,S,SW,W,NW"
    team-name: "{secondary}%team%"
    no-team: "{muted}No team {dark}{bullet} {secondary}/f create"
    members-title: "{primary}&lMembers"
    # One member: %role% is the marker below, %player% their name.
    member-online: "{success}%role%{secondary}%player%"
    member-offline: "{muted}%role%%player%"
    role-leader: "{primary}**"
    role-co-leader: "{primary}*"
    role-member: ""
    # One of the teams with most points.
    top-team: "{muted}%rank%. {secondary}%team% {dark}{bullet} {primary}%points%"
    no-event: "{muted}None running"
    # %team_tag% in the classic list's names, for a player with a team.
    team-tag: "{muted}[{secondary}%team%{muted}] "

