# ---------------------------------------------------------------------------
# HCFCore - English language file
# ---------------------------------------------------------------------------
# No player-facing text exists anywhere in the Java code: every message is looked
# up here by key. To translate, copy this file to lang/<code>.yml, translate it,
# and set "language: <code>" in config.yml. An empty message is not sent.
#
# Key convention: <module>.<context>.<message>
# Keys are fully nested (a "team:" section containing a "create:" section
# containing "success:"), never written as a dotted key on one line.
#
# Colours use legacy ampersand codes (&a, &c, ...). Placeholders are wrapped in
# percent signs and are substituted by name, so their order in a sentence is free
# to change between translations.
# ---------------------------------------------------------------------------

general:
  reload-success: "&aConfiguration reloaded successfully."
  reload-failed: "&cReload failed: %error% &7(see console)"
  no-permission: "&cYou do not have permission to use this command."
  player-only: "&cThis command can only be used by players."
  version: "&7Running &bHCFCore v%version% &7in &b%mode% &7mode."
  unknown-command: "&cUnknown command. Try &f/%label% help&c."

# Until every module has loaded its data, players are refused at login, and the
# commands that read or change that data answer with one of these instead of
# running. "failed" means a load did not succeed: the server stays closed until
# the cause is fixed and it is restarted.
startup:
  login:
    loading: "&eThe server is still starting up. &7Try again in a few seconds."
    failed: "&cThe server could not load its data. &7Please try again later."
  command:
    loading: "&eHCFCore is still loading its data. &7Try again in a few seconds."
    failed: "&cHCFCore could not load its data, so this command is unavailable. &7See the console, then restart the server."

team:
  # How a role is written in messages (%role%, %required%).
  role:
    leader: "Leader"
    co-leader: "Co-leader"
    member: "Member"

  # --- Name validation ---------------------------------------------------
  name:
    too-short: "&cA team name must be at least %min% characters long."
    too-long: "&cA team name may be at most %max% characters long."
    invalid-characters: "&c'%name%' contains characters that are not allowed in a team name."
    blacklisted: "&cThat team name is reserved."
    taken: "&cA team named '%name%' already exists."

  # --- Shared failures ---------------------------------------------------
  error:
    not-in-team: "&cYou are not in a team."
    target-not-in-team: "&cThat player is not in your team."
    not-a-member: "&cYou are not a member of %team%."
    insufficient-role: "&cYou must be at least %required% to do that (you are %role%)."
    cannot-target-self: "&cYou cannot target yourself."
    system-team-immutable: "&c%team% is a server team and cannot be modified."
    not-system-team: "&c%team% is a player team; only server teams are safe or combat zones."
    team-full: "&cThat team is full (%max% members)."
    not-found: "&cNo team named '%name%' was found."
    player-not-found: "&cNo player named '%player%' was found."

  # --- Lifecycle ---------------------------------------------------------
  # --- Server (system) teams: safe zones and combat zones -------------------
  system:
    created-safe: "&aServer team &f%team% &acreated as a &fsafe zone &a(no PvP while pvp.yml's safe-zones is on). Give it land with &f/team forceclaim %team% [radius]&a."
    created-combat: "&aServer team &f%team% &acreated as a &fcombat zone &a(PvP on). Give it land with &f/team forceclaim %team% [radius]&a."
    zone-safe: "&f%team% &ais now a &fsafe zone&a: nobody can be attacked on its land while pvp.yml's safe-zones is on."
    zone-combat: "&f%team% &ais now a &fcombat zone&a: players can fight on its land."
    invalid-zone: "&c'%input%' is not a zone kind - use safe or combat."

  create:
    success: "&aTeam &f%team% &acreated. Invite members with &f/team invite <player>&a."
    already-in-team: "&cYou are already in a team. Leave it first."
    cancelled: "&cTeam creation was cancelled."
  disband:
    success: "&aTeam &f%team% &ahas been disbanded."
    cancelled: "&cDisbanding the team was cancelled."
    broadcast: "&cYour team has been disbanded by %player%."
  rename:
    success: "&aTeam renamed from &f%old% &ato &f%name%&a."
    same-name: "&cYour team is already called '%name%'."
    cancelled: "&cRenaming the team was cancelled."
    broadcast: "&eYour team was renamed to &f%name% &eby %player%."

  # --- Invitations -------------------------------------------------------
  invite:
    sent: "&aInvitation sent."
    received: "&e%player% invited you to join &f%team%&e. Use &f/team join %team% &eto accept."
    already-sent: "&cThat player already has a pending invitation."
    target-in-team: "&cThat player is already in a team."
    revoked: "&aInvitation revoked."
    not-found: "&cThat player has no pending invitation from your team."
    broadcast: "&e%player% invited %target% to the team."
  join:
    success: "&aYou joined &f%team%&a."
    no-invite: "&cYou have no pending invitation from %team%."
    already-in-team: "&cYou are already in a team."
    broadcast: "&a%player% joined the team."
    # /team forcejoin, to the staff member who typed it.
    forced: "&aPut &f%player% &ain &f%team%&a."
    forced-already-in-team: "&c%player% is already in a team."

  # --- Leaving -----------------------------------------------------------
  leave:
    success: "&aYou left &f%team%&a."
    leader-must-transfer: "&cHand over leadership before leaving &f%team%&c."
    disbanded: "&aYou left &f%team%&a, and as its last member the team was disbanded."
    broadcast: "&e%player% left the team."
  kick:
    success: "&aPlayer kicked from the team."
    kicked: "&cYou were kicked from &f%team% &cby %player%."
    broadcast: "&e%target% was kicked from the team by %player%."

  # --- Roles -------------------------------------------------------------
  promote:
    success: "&aPromoted to &f%role%&a."
    already-highest: "&cThat player is already %role% - use &f/team transfer &cto hand over leadership."
    co-leader-limit: "&cYour team already has the maximum of %max% co-leaders."
    broadcast: "&a%target% was promoted to %role% by %player%."
  demote:
    success: "&aDemoted to &f%role%&a."
    already-lowest: "&cThat player is already %role%."
    cannot-demote-leader: "&cThe leader cannot be demoted - hand over leadership instead."
    broadcast: "&e%target% was demoted to %role% by %player%."
  transfer:
    success: "&aLeadership of &f%team% &ahas been handed over."
    broadcast: "&e%target% is now the leader of the team."
    # /team forcekick removed the leader: to the staff member, who took over.
    forced: "&7%player% &7now leads &f%team%&7, in place of the player you removed."

  # --- Alliances ---------------------------------------------------------
  ally:
    disabled: "&cAlliances are disabled on this server."
    same-team: "&cYou cannot ally your own team."
    already-allied: "&cYou are already allied with %team%."
    request-sent: "&aAlliance request sent to &f%team%&a."
    request-already-sent: "&cYou already have a pending alliance request to %team%."
    now-allied: "&aYou are now allied with &f%team%&a."
    limit-reached: "&cYour team has reached its alliance limit (%max%)."
    target-limit-reached: "&c%team% has reached its alliance limit (%max%)."
    received: "&e%team% has requested an alliance. Use &f/team ally %team% &eto accept."
    broadcast: "&aYour team is now allied with &f%team%&a."
  unally:
    success: "&aAlliance with &f%team% &abroken."
    not-allied: "&cYou are not allied with %team%."
    broadcast: "&cYour team is no longer allied with &f%team%&c."

  # --- Focus -------------------------------------------------------------
  focus:
    disabled: "&cFocus is disabled on this server."
    team-success: "&aYour team is now focusing &f%target%&a."
    player-success: "&aYour team is now focusing &f%target%&a."
    already-focused: "&cYour team is already focusing %target%."
    limit-reached: "&cYour team can focus at most %max% target(s) at once."
    cannot-focus-own-team: "&cYou cannot focus your own team."
    broadcast: "&eYour team is now focusing &f%target%&e."
  unfocus:
    success: "&aNo longer focusing &f%target%&a."
    not-focused: "&cYour team is not focusing %target%."

  # --- Rally -------------------------------------------------------------
  rally:
    disabled: "&cRally is disabled on this server."
    set: "&aRally point set. It stays active for %seconds% seconds."
    cleared: "&aRally point cleared."
    not-set: "&cYour team has no rally point set."
    broadcast: "&e%player% set a rally point. Your compass now points to it."

  # --- Bank, points, KOTH ------------------------------------------------
  bank:
    disabled: "&cTeam banks are disabled on this server."
    invalid-amount: "&cEnter a positive amount."
    insufficient-funds: "&cYour team bank only holds %balance%."
    deposit-success: "&aDeposited %amount%. Team balance: %balance%."
    withdraw-success: "&aWithdrew %amount%. Team balance: %balance%."
  points:
    set: "&aPoints for &f%team% &aset to &f%points%&a."
    added: "&a%amount% point(s) applied to &f%team%&a. New total: &f%points%&a."
  koth:
    cap-reached: "&e%team% has reached its cap of %max% counted KOTH capture(s)."
    capture-counted: "&aKOTH capture recorded for &f%team% &a(%captures% total)."
    reset: "&7Counted KOTH captures reset for &f%count% &7team(s)."

  # --- Command layer -----------------------------------------------------
  command:
    unknown-subcommand: "&cUnknown subcommand '&f%input%&c'. Try &f/%label% help&c."
    usage: "&cUsage: &f/%label% %usage%"
    help-header: "&7&m--------&r &bTeam commands &7&m--------"
    help-entry: "&f/%label% %usage% &7- &7%description%"
    invalid-number: "&c'%input%' is not a valid number."

  info:
    header: "&7&m--------&r &b%team% &7&m--------"
    leader: "&7Leader: &f%leader%"
    co-leaders: "&7Co-leaders: &f%members%"
    members: "&7Members: &f%members%"
    online: "&7Online: &f%online%&7/&f%total%"
    balance: "&7Balance: &f%balance%"
    points: "&7Points: &f%points%"
    koth-captures: "&7KOTH captures: &f%captures%"
    allies: "&7Allies: &f%allies%"
    rally: "&7Rally: &f%world% %x%, %y%, %z%"
    none: "&7none"
    zone-safe: "&7Server land - &asafe zone&7: nobody can be attacked here."
    zone-combat: "&7Server land - &ccombat zone&7: players can fight here."

  list:
    header: "&7&m--------&r &bTop teams &7&m--------"
    entry: "&7%rank%. &f%team% &7- &f%points% &7point(s), &f%members% &7member(s)"
    empty: "&7No teams have been created yet."

  chat:
    switched: "&aYou are now talking in &f%channel% &achat."
    format-team: "&9[Team] &b%player%&7: &f%message%"
    format-ally: "&d[Ally] &b%player%&7: &f%message%"
    # The console's copy of a team or ally line (chat.yml, log-team-chat). It names
    # the team, which the members do not need but whoever reads the log does.
    # %channel% is TEAM or ALLY.
    log: "[%channel%] %team% - %player%: %message%"

