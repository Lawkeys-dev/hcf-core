    notify-claimed: "&aA staff member is looking at your ticket &f#%id%&a."
    notify-closed: "&7Your ticket &f#%id% &7has been closed."
    menu:
      title: "&9Tickets &8(&f%count%&8)"
      more: "&7The menu shows the oldest &f%shown%&7; &f%count% &7more are in &f/tickets list&7."
      report-name: "&c#%id% &fReport &7- &b%target%"
      request-name: "&e#%id% &fRequest &7- &b%player%"
      from: "&7From: &b%player%"
      about: "&7About: &b%target%"
      status: "&7Status: &f%status%"
      age: "&7Opened &f%age% &7ago"
      message-line: "&f%line%"
      left-click: "&aLeft-click &7to claim it and teleport"
      right-click: "&cRight-click &7to close it"

  # Strikes against teams (staff.yml, strikes).
  strike:
    issued: "&7Struck &c%team%&7 - &f%count% &7active (&f#%id%&7)."
    announce: "&8[&9Staff&8] &b%staff% &7struck &c%team%%subject% &7(&f%count% &7active): &f%reason%"
