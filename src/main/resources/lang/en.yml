    stopped: "&7%event% &7has been stopped."
    cancelled:
      not-enough-players: "&7%event% &7is called off: it needs at least &f%minimum% &7players."
      no-warzone: "&7%event% &7is called off: its world has no warzone."
      no-spot: "&7%event% &7is called off: no safe spot was found in the warzone."
