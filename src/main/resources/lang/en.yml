# ---------------------------------------------------------------------------
# PvP / combat module
# ---------------------------------------------------------------------------
pvp:
  # Classic combat (config.yml, combat: classic; pvp.yml, legacy-combat).
  legacy:
    no-offhand: "&cThere is no off-hand in classic combat."
    no-shield: "&cShields do not work in classic combat - block with your sword."

  # The ender pearl cooldown (pvp.yml, ender-pearl-cooldown).
  pearl:
    cooldown: "&cYou cannot throw an ender pearl for &f%time%&c."
    blocks-teleport: "&cYou cannot teleport until your ender pearl cooldown is over (&f%time% &cleft)."

  # Item cooldowns (pvp.yml, item-cooldowns). %item% is the item's name there.
  item-cooldown:
    refused: "&cYou cannot use %item% &cfor &f%time%&c."

  tag:
    tagged: "&cYou are now in combat for &f%seconds%s&c. You cannot teleport or log out safely."
    expired: "&aYou are no longer in combat."
    blocks-teleport: "&cYou cannot teleport while in combat (&f%time% &cleft)."
    blocks-logout: "&cYou cannot log out while in combat (&f%time% &cleft): leaving now would kill you."
    status-active: "&7Combat tag: &c%time% &7remaining."
    status-clear: "&7Combat tag: &anone&7."

  deathban:
    applied: "&cYou died. You cannot rejoin for &f%time%&c."
    login-denied: "&cYou are deathbanned for another &f%time%&c."
    lifted: "&aDeathban lifted for &f%player%&a."
    not-banned: "&7%player% is not deathbanned."
    status: "&7Deathban: &c%time% &7remaining."
    set: "&aDeathbanned &f%player% &afor &f%time%&a."
    invalid-length: "&c'%input%' is not a ban length: give a number of seconds above zero."
    # EOTW: a death bans until the end of the map; staff lift it after the reset.
    map-end:
      applied: "&cYou died during EOTW. You cannot rejoin until the end of the map."
      login-denied: "&cYou died during EOTW and are deathbanned until the end of the map."
      status: "&7Deathban: &cuntil the end of the map&7."

  safezone:
    attacker: "&cYou cannot fight inside a safe zone."

  # pvp.yml, friendly-fire
  friendly-fire:
    teammate: "&eYou cannot hurt &a%player%&e: they are on your team."
    ally: "&eYou cannot hurt your ally &d%player% &eoutside an event zone."

  status:
    header: "&7&m--------&r &bCombat status - %player% &7&m--------"

  error:
    player-not-found: "&cNo player named '%player%' was found."
    invalid-number: "&c'%input%' is not a valid number."
    disabled: "&cThe PvP module is disabled on this server."

