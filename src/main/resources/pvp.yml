# ---------------------------------------------------------------------------
# HCFCore - PvP / combat configuration
# ---------------------------------------------------------------------------
# Deathban, combat tag, strength nerf, safe zones, loot protection and
# anti-logout. Changes take effect on /hcf reload.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:enabled]
# Turning this off disables the whole module: no deathbans, no combat tags, no
# combat tweaks.
enabled: true
# --8<-- [end:enabled]

# --8<-- [start:deathban]
deathban:
  # Keep a player out of the server for a while after they die.
  enabled: true
  # Ban length for a player with no matching tier below.
  duration-seconds: 3600
  # Shorter bans for ranks. The SHORTEST matching tier wins, so granting a rank
  # is always a reduction and never accidentally a penalty. Only the nodes listed
  # here are checked, so an unrelated wildcard grant cannot silently shorten
  # somebody's ban.
  permission-tiers:
    hcfcore.deathban.tier.short: 900
  # Staff with hcfcore.deathban.bypass are never banned in the first place: the
  # permission is read at the death, where the player is still on the server. It
  # cannot be read at the login - the connection carries a profile, not a player -
  # so granting it to somebody who is already banned does not let them back in.
  # Clear that ban with /pvp lift <player>, which works from the console.
# --8<-- [end:deathban]

# --8<-- [start:combat-tag]
combat-tag:
  enabled: true
  # How long a hit keeps a player in combat.
  duration-seconds: 30
  # Tag the attacker as well as the victim, so hitting someone commits you too.
  tag-attacker: true
  # Kill a tagged player who disconnects. This is the classic HCF answer to
  # combat logging, and the reason the tag exists at all: without it, a losing
  # fight is escaped by pulling the plug. The death runs the normal path, so the
  # deathban applies and the team loses DTR.
  kill-on-logout: true
  # Refuse plugin teleports (such as /team hq) while tagged.
  block-teleport: true
# --8<-- [end:combat-tag]

# --8<-- [start:ender-pearl-cooldown]
# The HCF pearl cooldown: a wait between two ender pearls, shown on the
# scoreboard (%pearl_line%) and on Lunar Client. A partner item's Fake Pearl
# has its own and never starts this one.
ender-pearl-cooldown:
  enabled: true
  seconds: 15
  # The pearls in the hotbar show the wait, greyed out as the game shows its own.
  show-on-item: true
  # A death ends it.
  clear-on-death: true
  # Refuse plugin teleports (/spawn, /team hq, /team stuck, /top, /world) until
  # it is over: a pearl out of a fight is not followed by a command out of it.
  block-teleport: true
# --8<-- [end:ender-pearl-cooldown]

# --8<-- [start:item-cooldowns]
# A wait between two uses of an item: eaten (a golden apple, a chorus fruit) or,
# for a totem, saving its holder. Used again meanwhile, it is refused - a totem
# on cooldown saves nobody. The wait is kept on the player: an hour's Gapple
# survives logouts and restarts.
#
# Each item has an id - its scoreboard rows are %cooldown_<id>% (the time) and
# %cooldown_<id>_line% (a whole row, from lang/en.yml) - and:
#   material        the item
#   seconds         the wait
#   name            how the scoreboard and the messages call it
#   show-on-item    the items in the hotbar show the wait, greyed out as the
#                   game shows its own
#   clear-on-death  a death ends it
# Partner items (abilities.yml) are never counted: a Golden Head has its own.
item-cooldowns:
  enabled: true
  items:
    notch-apple:
      material: ENCHANTED_GOLDEN_APPLE
      seconds: 3600
      name: "{primary}Gapple"
      show-on-item: true
      clear-on-death: false
    golden-apple:
      material: GOLDEN_APPLE
      seconds: 10
      name: "{primary}Crapple"
      show-on-item: true
      clear-on-death: true
    chorus-fruit:
      material: CHORUS_FRUIT
      seconds: 15
      name: "{primary}Chorus"
      show-on-item: true
      clear-on-death: true
    totem:
      material: TOTEM_OF_UNDYING
      seconds: 120
      name: "{primary}Totem"
      show-on-item: true
      clear-on-death: false
# --8<-- [end:item-cooldowns]

# --8<-- [start:strength-nerf]
strength-nerf:
  # The historic HCF nerf of Strength potions.
  enabled: true
  # ⚠️ Damage vanilla adds PER STRENGTH LEVEL. This module subtracts it and adds
  # its own figure instead.
  #
  # This is a config value on purpose. Mojang has changed the formula before (a
  # damage multiplier before 1.9, a flat bonus after), and the value for the
  # targeted version could not be confirmed against the official documentation
  # when this module was written, and a guess is not presented as fact here.
  # VERIFY IT for your server version and correct it here; no recompilation is
  # needed.
  vanilla-bonus-per-level: 3.0
  # Damage this module adds per level instead.
  nerfed-bonus-per-level: 1.5
  # (An "effect-names" list used to follow here, for servers whose API spelled
  # the Strength effect differently. It is read through Paper's STRENGTH constant
  # now, verified in the 26.2 sources, and the list is ignored if still present.)
# --8<-- [end:strength-nerf]

# --8<-- [start:knockback]
knockback:
  # Scale knockback. Off by default: this changes the feel of combat, so it
  # should be a deliberate choice rather than something a server inherits.
  #
  # Only knockback from one player hitting another - with a weapon, a fist or a
  # projectile - is scaled, through Paper's own knockback event: the knockback
  # itself is scaled, not whatever else is moving the victim at that moment.
  enabled: false
  # 1.0 is vanilla.
  horizontal: 1.0
  vertical: 1.0
# --8<-- [end:knockback]

# --8<-- [start:attack-speed]
attack-speed:
  # Every player's attack-speed attribute. Off by default: like knockback, this
  # changes how combat feels, so it should be a deliberate choice.
  #
  # The value replaces the player's base; the weapon in hand still adds its own
  # modifier on top (a sword lowers it). The higher the value, the shorter the
  # recharge between full-strength hits. Vanilla's base is 4 (the Minecraft Wiki's
  # figure - Paper does not document it; the plugin reads the real base at runtime
  # and only adds the difference). Servers after a pre-1.9 feel set a large value;
  # how large removes the recharge entirely is Mojang's formula, so try it.
  #
  # Given as a modifier that is never saved to player data: turning this off, or
  # removing the plugin, leaves nobody with a changed attribute.
  enabled: false
  value: 4.0
# --8<-- [end:attack-speed]

# --8<-- [start:safe-zones]
safe-zones:
  # Disable PvP on the land of server teams created as SAFE zones - spawn,
  # typically. Server teams created as COMBAT zones (warzone, roads, event
  # grounds) are fought on like anywhere else. Both are made the same way:
  #   /team createsystem <name> <safe|combat>, then /team forceclaim <name> [radius]
  # and /team setzone <name> <safe|combat> switches one later.
  # Turning this off makes every server team fightable, whatever its kind.
  enabled: true
# --8<-- [end:safe-zones]

# --8<-- [start:loot-protection]
# Anticlean - loot protection. For a few seconds after a kill, what the dead player
# drops can be picked up only by the killer (and, with team-shares, the killer's
# team): no other player, no mob, no hopper. Then it is ordinary loot. A death with
# no killer - lava, a fall - is not protected. The drops still fall where they
# always did; they only carry the claim.
loot-protection:
  enabled: true
  seconds: 10
  team-shares: true
# --8<-- [end:loot-protection]

# --8<-- [start:friendly-fire]
# Hits between players on the same side. The default rule:
# teammates never hurt each other, and allies only inside an event area - a running
# KOTH, Citadel or Conquest zone, or a hit on or by the King during Kill the King -
# since that is where allied teams compete (captures and the King are strictly per
# team). A refused hit does nothing and tags nobody.
friendly-fire:
  # Can teammates hurt each other?
  teammates: false
  # Where can allies hurt each other? ALWAYS, EVENT_AREAS or NEVER.
  allies: EVENT_AREAS
# --8<-- [end:friendly-fire]

# --8<-- [start:legacy-combat]
# ---------------------------------------------------------------------------
# Classic combat - the 1.7.10 feel
# ---------------------------------------------------------------------------
# Used only while config.yml says "combat: classic"; in "modern", nothing below
# applies. Every value ships at what 1.7.10 did; each part can be switched off on
# its own, and its numbers tuned, as HCF servers always tuned their combat.
#
# The knockback multipliers and attack speed above still apply on top of it.
legacy-combat:

  # --8<-- [start:legacy-cooldown]
  # No wait between two full-strength hits: the attack-speed attribute is set so
  # high that every click is a full hit, as in 1.7. Replaces attack-speed above.
  attack-cooldown:
    remove: true
    attack-speed: 1024.0
  # --8<-- [end:legacy-cooldown]

  # --8<-- [start:legacy-sweep]
  # 1.7 had no sweep attack: the sweep's damage to the players around is refused.
  no-sweep-attacks: true
  # --8<-- [end:legacy-sweep]

  # --8<-- [start:legacy-weapons]
  # 1.7 weapon damage: what a hit with each item deals, the player's own 1 point
  # included (a diamond sword's "+7 Attack Damage" on top of the player's 1 = 8).
  # Swords hit harder than today, axes much softer: the sword was the weapon.
  # Values from the 1.7.10 game's item classes. Netherite did not exist: one step
  # above diamond. An item not listed keeps its modern damage; remove one to keep
  # it modern. A weapon whose attributes a kit or another plugin set is left alone.
  weapon-damage:
    enabled: true
    damage:
      # swords
      wooden_sword: 5
      golden_sword: 5
      stone_sword: 6
      iron_sword: 7
      diamond_sword: 8
      netherite_sword: 9
      # axes
      wooden_axe: 4
      golden_axe: 4
      stone_axe: 5
      iron_axe: 6
      diamond_axe: 7
      netherite_axe: 8
      # pickaxes
      wooden_pickaxe: 3
      golden_pickaxe: 3
      stone_pickaxe: 4
      iron_pickaxe: 5
      diamond_pickaxe: 6
      netherite_pickaxe: 7
      # shovels
      wooden_shovel: 2
      golden_shovel: 2
      stone_shovel: 3
      iron_shovel: 4
      diamond_shovel: 5
      netherite_shovel: 6
  # --8<-- [end:legacy-weapons]

  # --8<-- [start:legacy-enchantments]
  # 1.7 Sharpness: +1.25 damage per level (Sharpness V: +6.25), where the modern
  # game gives 1 at level I and 0.5 per level above (V: +3). Then as now, it is
  # added last: a critical hit or Strength never multiplies it. The other combat
  # enchantments already play as in 1.7 (Power, Punch, Fire Aspect, Flame;
  # Knockback through the knockback below).
  enchantments:
    enabled: true
    sharpness-per-level: 1.25
  # --8<-- [end:legacy-enchantments]

  # --8<-- [start:legacy-criticals]
  # A critical hit while falling - sprinting included, which the modern game
  # refuses. It multiplies the weapon's damage and Strength, never Sharpness.
  critical-hits:
    enabled: true
    multiplier: 1.5
  # --8<-- [end:legacy-criticals]

  # --8<-- [start:legacy-blocking]
  # Right-click with a sword to block, as in 1.7: it takes (damage + 1) / 2, from
  # every direction, with no delay, no sound and no wear on the sword. What is
  # blocked is base + factor x damage. Swords get this while held; it is taken off
  # when classic combat or blocking is switched off.
  sword-blocking:
    enabled: true
    base: -0.5
    factor: 0.5
  # --8<-- [end:legacy-blocking]

  # --8<-- [start:legacy-knockback]
  # 1.7.10 knockback for a melee hit. The victim's velocity is divided by friction,
  # then pushed "horizontal" away and "vertical" up - capped at vertical-limit -
  # in the air as on the ground: that is what makes 1.7 combos. The modern game
  # only lifts a victim who stands on the ground. A sprint hit, or a Knockback
  # enchantment, adds extra-horizontal per level and extra-vertical up.
  knockback:
    enabled: true
    friction: 2.0
    horizontal: 0.4
    vertical: 0.4
    vertical-limit: 0.4
    extra-horizontal: 0.5
    extra-vertical: 0.1
  # --8<-- [end:legacy-knockback]

  # --8<-- [start:legacy-offhand]
  # 1.7 had neither an off-hand nor shields. Whatever sits in the off-hand is moved
  # into the inventory (or dropped when it is full).
  disable-offhand: true
  disable-shields: true
  # --8<-- [end:legacy-offhand]

  # --8<-- [start:legacy-potions]
  # Splash and lingering potions leave the hand as in 1.7: straight where the
  # player looks, lifted by pitch-offset degrees, at "speed" - WITHOUT the player's
  # own movement, which the modern game adds and which makes pots fly ahead of a
  # running player. Raise speed for faster pots.
  thrown-potions:
    enabled: true
    speed: 0.5
    pitch-offset: -20.0
    inaccuracy: 1.0
  # --8<-- [end:legacy-potions]

  # --8<-- [start:legacy-pearls]
  # Ender pearls: no one-second cooldown (1.7 had none - an HCF pearl cooldown is
  # a separate matter), and thrown as 1.7 threw them.
  ender-pearls:
    no-cooldown: true
    enabled: true
    speed: 1.5
    pitch-offset: 0.0
    inaccuracy: 1.0
  # --8<-- [end:legacy-pearls]

  # --8<-- [start:legacy-regeneration]
  # 1.7.10's natural regeneration: "amount" health (1.0 is half a heart) every
  # interval-seconds while the food bar is at minimum-food or more, each costing
  # "exhaustion" - instead of the modern fast regeneration from saturation. Only
  # where the world's natural health regeneration gamerule is on.
  natural-regeneration:
    enabled: true
    interval-seconds: 4.0
    amount: 1.0
    minimum-food: 18
    exhaustion: 3.0
  # --8<-- [end:legacy-regeneration]

  # --8<-- [start:legacy-apples]
  # Golden apples as in 1.7.10. The enchanted (Notch) apple gave Regeneration V.
  # Each effect is an effect name, a level and seconds.
  golden-apples:
    enabled: true
    golden-apple:
      food: 4
      saturation: 9.6
      effects:
        - {effect: regeneration, level: 2, seconds: 5}
        - {effect: absorption, level: 1, seconds: 120}
    enchanted-golden-apple:
      food: 4
      saturation: 9.6
      effects:
        - {effect: regeneration, level: 5, seconds: 30}
        - {effect: absorption, level: 1, seconds: 120}
        - {effect: resistance, level: 1, seconds: 300}
        - {effect: fire_resistance, level: 1, seconds: 300}
  # --8<-- [end:legacy-apples]

  # --8<-- [start:legacy-strength]
  # 1.7 Strength: a percentage of the weapon's damage, where the modern game adds
  # points - the weapon's damage multiplied by 1 + per-level x level: Strength I
  # was +130%, Strength II +260%. While on, strength-nerf above does not apply:
  # it takes points off, and 1.7 Strength has none.
  strength:
    enabled: true
    per-level: 1.3
    # The HCF nerf of 1.7 Strength, a percentage too: per-level below instead of
    # the one above. Shipped at half, as strength-nerf halves the modern bonus
    # (0.65: Strength I +65%, Strength II +130%). Off gives 1.7.10's own Strength.
    nerf:
      enabled: true
      per-level: 0.65
  # --8<-- [end:legacy-strength]

  # --8<-- [start:legacy-rod]
  # A fishing rod's hook hitting a player knocks them back, shows them hurt and
  # tags both, as in 1.7 - "rodding". Only a player the angler could hit.
  # remove-hook takes the bobber back at once, ready to cast again, instead of
  # leaving it on the player until reeled in - which also pulls them.
  fishing-rod:
    enabled: true
    remove-hook: true
  # --8<-- [end:legacy-rod]
# --8<-- [end:legacy-combat]
