# ---------------------------------------------------------------------------
# schedule.yml - things that happen on a clock
#
# Rotating tips, announcements and commands at fixed times, countdowns staff
# start by hand, and the key-all. /hcf reload applies changes at once.
#
# NOTHING HERE SHIPS SWITCHED ON: tips are off, and every list is empty. What a
# server announces, and what its keys are, belong to it.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

enabled: true

# --8<-- [start:time-zone]
# Time zone the schedule times below are read in. "system" follows the host
# clock; prefer naming one (for example "Europe/Paris") so a host move does not
# shift every announcement.
time-zone: "system"
# --8<-- [end:time-zone]

# --8<-- [start:tips]
tips:
  # A line of advice every so often. Off by default: a message nobody asked for,
  # every few minutes, is something an operator has to go and turn off.
  # Players can switch tips off for themselves with /settings.
  enabled: false
  # At least 10.
  interval-seconds: 300
  # in-order, or random - which never shows the same tip twice running.
  order: in-order
  prefix: "{dark}[{warning}Tip{dark}] {muted}"
  messages:
    - "Type {secondary}/team help {muted}to see every team command."
    - "{secondary}/events {muted}lists what is running and what is coming."
    - "{secondary}/stats {muted}and {secondary}/leaderboard {muted}show how you are doing."
# --8<-- [end:tips]

# --8<-- [start:schedules]
# Announcements and commands at fixed times, every day. Each entry needs at least
# one time and a broadcast or a command; commands run from the console.
#
#   schedules:
#     evening-koth:
#       times: ["18:00", "21:00"]
#       broadcast: "&6A KOTH starts in 5 minutes!"
#       commands: []
#     nightly-restart-warning:
#       times: ["03:55"]
#       broadcast: "&cThe server restarts in 5 minutes."
schedules: {}
# --8<-- [end:schedules]

# --8<-- [start:timers]
# Countdowns started with /timer start <name> <duration> [label]. They show on
# the scoreboard (%timer_1% to %timer_3% in ui.yml) and end with a line in chat.
# A name listed here gets its label, and can say and do something when it ends.
# Any other name works too, with the label typed in the command.
#
#   timers:
#     double-points:
#       label: "&dDouble Points"
#       end-broadcast: "&dDouble points are over."
#       end-commands:
#         - "some-command %timer%"
#
# Timers live in memory: a restart ends them.
timers: {}
# --8<-- [end:timers]

# --8<-- [start:key-all]
key-all:
  # /keyall runs these commands once for every player online, from the console
  # (%player% is filled in). This plugin has no crates: point them at whatever
  # your crate plugin, economy or kit provides. Empty, /keyall refuses rather
  # than announcing a key-all that gives nothing.
  #
  #   commands:
  #     - "crates key give %player% vote 1"
  commands: []
  # Said once it has run; %count% is how many players received it.
  broadcast: "{primary}&lKEY-ALL! {muted}%count% players received a key."
  # The label of the countdown /keyall <duration> starts.
  label: "{primary}Key-All"
# --8<-- [end:key-all]
