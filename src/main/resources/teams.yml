# ---------------------------------------------------------------------------
# HCFCore - Team module configuration
# ---------------------------------------------------------------------------
# Every rule the team module applies is defined here. Nothing below is
# duplicated as a constant in the plugin's code: no gameplay value should ever
# need a recompile.
#
# Changes take effect on /hcf reload - no server restart needed.
#
# Convention used throughout this file: a limit of 0 means "no limit".
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:names]
names:
  min-length: 3
  max-length: 16
  # Regex a team name must match in full. The default allows letters, digits and
  # underscores only. An invalid regex is reported in the console at load time and
  # the built-in default is used instead, rather than failing every command later.
  pattern: "^[A-Za-z0-9_]+$"
  # Names players may not use, compared case-insensitively. Staff-created system
  # teams are exempt from this list (but not from the length/pattern rules).
  blacklist:
    - "spawn"
    - "warzone"
    - "wilderness"
    - "staff"
    - "admin"
# --8<-- [end:names]

# --8<-- [start:membership]
# Maximum members per team. 0 = unlimited.
max-members: 20
# Maximum simultaneous co-leaders. 0 = unlimited.
max-co-leaders: 2

# How long an invitation stays valid, in seconds. 0 = invitations never expire.
invite-expiry-seconds: 300

# When the last remaining member leaves (or is removed), disband the team instead
# of leaving an empty one behind. Set to false if you would rather keep empty
# teams around, for example so their claims survive a temporary emptying.
disband-on-last-member-leave: true

# Role the outgoing leader drops to after handing over leadership.
# One of: leader, co-leader, member.
role-after-leadership-transfer: co-leader
# --8<-- [end:membership]

# ---------------------------------------------------------------------------
# Minimum role required for each action. One of: leader, co-leader, member.
# An unrecognised value falls back to "leader" (the safest option) and is
# reported in the console.
# ---------------------------------------------------------------------------
# --8<-- [start:required-roles]
required-roles:
  disband: leader
  rename: leader
  invite: co-leader
  revoke-invite: co-leader
  kick: co-leader
  promote: leader
  demote: leader
  transfer-leadership: leader
  ally: leader
  unally: leader
  focus: co-leader
  rally: co-leader
  bank-deposit: member
  bank-withdraw: leader
# --8<-- [end:required-roles]

# --8<-- [start:alliances]
alliances:
  enabled: true
  # Maximum allied teams per team. 0 = unlimited.
  max-allies: 1
# --8<-- [end:alliances]

# --8<-- [start:focus]
focus:
  enabled: true
  # Maximum simultaneous focus targets (teams and players combined). 0 = unlimited.
  max-targets: 0
# --8<-- [end:focus]

# --8<-- [start:rally]
rally:
  enabled: true
  # How long a rally point stays active, in seconds. 0 = until cleared manually.
  duration-seconds: 300
# --8<-- [end:rally]

# --8<-- [start:lff]
# /lff [note] - "looking for faction": a player with no team tells everybody
# they want one, with a few words about themselves if they like.
lff:
  enabled: true
  # Seconds before the same player can use it again: an announcement, not a
  # spam channel.
  cooldown-seconds: 300
  # The longest note kept, in characters (0 to 200); the rest is cut.
  max-note-length: 64
# --8<-- [end:lff]

# --8<-- [start:bank]
bank:
  # Turning this off rejects every deposit/withdraw on a team bank.
  # Money moves between a player's balance and the bank with /team deposit and
  # /team withdraw; turning the economy off in economy.yml disables those too.
  enabled: true
# --8<-- [end:bank]

# --8<-- [start:points]
points:
  # Points a newly created team starts with.
  starting: 0
  # Floor the score can never drop below.
  minimum: 0

  # The scale: what earns - or, with a negative number, costs - points. As
  # shipped a kill is +1 and a death -2, and an event is worth far more than the
  # kills fought for it along the way - a KOTH 100 (koth.points-per-capture
  # below), a Citadel 300 - so the event, not the farm, decides the ranking.
  # To the killer's team, for killing a player of any other team, or of none. A
  # player with no team can be an alt: watch for farming.
  per-kill: 1
  # To the victim's team, for any death of a member. A death costs more than a
  # kill earns: trading lives is a loss.
  per-death: -2
  # What a team loses when its DTR makes it raidable - being raided is the worst
  # that can happen to it. Either a share of its points, 0 to 100 (50: half)...
  raidable-loss-percent: 50
  # ...or, with the share at 0, a fixed number (write a negative one).
  per-raidable: 0
  # To the team that captures a Citadel: three times a KOTH's hold.
  per-citadel-capture: 300
  # To the team that wins a Conquest: a long fight over several zones.
  per-conquest-win: 250
  # To the team that wins a DTC, or a Slide.
  per-dtc-win: 200
  per-slide-win: 200
  # To the team of the player who wins Kill the King, and to the team that wins
  # a Last Break - the last hit decides it, however the rest went.
  per-king-win: 150
  per-last-break-win: 150
  # To the team that wins a Totem, and a Mini Totem (a column of 3 blocks or fewer).
  per-totem-win: 150
  per-mini-totem-win: 80
# --8<-- [end:points]

# --8<-- [start:koth]
koth:
  # Cap on how many KOTH captures count toward a team's ranking. 0 = uncapped.
  # A KOTH capture is worth points-per-capture (a Citadel's is
  # points.per-citadel-capture); both count toward the cap, which is a balance
  # decision for your server, so it ships uncapped.
  max-counted-captures: 0
  points-per-capture: 100
  # Counted captures are reset by staff with /team resetkoth - at the start of a
  # map, or of whatever ranking period the server runs.
# --8<-- [end:koth]
