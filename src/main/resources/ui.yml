# ---------------------------------------------------------------------------
# ui.yml - the scoreboard and tab list
#
# /hcf reload rebuilds every board at once.
#
# Lines "# --8<-- [start:...]" and "# --8<-- [end:...]" mark the parts the online
# documentation quotes from this file. They are comments and change nothing.
# ---------------------------------------------------------------------------

# --8<-- [start:scoreboard]
scoreboard:
  enabled: true
  # How often the board is redrawn, in ticks. 20 is once a second, which is as
  # fine as any countdown on it needs; lowering it costs a redraw per player per
  # tick for no visible gain.
  update-ticks: 20
  # Written in small capitals when theme.yml says so (small-caps-titles).
  title: "{primary}&lHCF"

  # --8<-- [start:scoreboard-lines]
  # The rows, top to bottom. A scoreboard shows at most 15; anything past that is
  # never drawn, and you are told so in the console.
  #
  # A row whose placeholders all come out empty is DROPPED rather than left blank.
  # That is how a conditional row works: %combat_line% is nothing while you are
  # not in combat, so the row simply is not there. It is also why a server that
  # does not run a module needs no edits here - its placeholders are just empty.
  #
  # Placeholders:
  #   %player%        your name              %online%    players online
  #   %world%         world you are in       %ping%      your ping
  #   %team%          your team, or "None"   %territory% team owning your chunk
  #   %dtr%           your team's DTR        %dtr_coloured%  the same, coloured,
  #                                          with a marker when raidable
  #   %dtr_max%       your team's maximum DTR, which grows with its size
  #   %kills% %deaths% %kdr% %killstreak% %playtime%
  #   %balance%       your balance, formatted
  #   %focus_line%    who your team is focusing (online players first, then teams)
  #   %rally_line%    your team's rally point, while it lasts
  #   %combat%        combat tag left        %combat_line%   a whole ready-made row
  #   %pearl%         ender pearl cooldown   %pearl_line%    a whole ready-made row
  #   %cooldown_<id>% %cooldown_<id>_line%   an item cooldown of pvp.yml
  #                   (item-cooldowns), by its id: %cooldown_notch-apple_line%
  #   %deathban% %deathban_line%   always empty: a deathbanned player is not online to
  #                   read a board. Kept so a file that lists them still renders.
  #   %phase_line%    SOTW/EOTW row, empty when neither runs
  #   %event_line%    the running KOTH/Citadel closest to being captured
  #   %king_line%     the King and their time left, during Kill the King
  #   %king_location_line%  where the King is, during Kill the King
  #   %conquest_line% the running Conquest's leader and points
  #   %conquest_zone_1% to %conquest_zone_4%   each Conquest zone's countdown
  #   %timer_1% %timer_2% %timer_3%   the custom timers (/timer, /keyall), the
  #                   one ending soonest first - each a whole ready-made row
  #   %class_line%    your class, or the class warming up and its time left
  #   %class_energy_line%  your class's energy, for a class that has some (Bard)
  #   %archer_tag_line%    how long you stay archer-tagged
  #   %class%         your class's name, empty in none
  #
  # The *_line placeholders are whole rows from lang/en.yml, so the wording is
  # translated in one place rather than written twice here.
  #
  # A row starting with a tag - [team], [stats], [balance], [combat],
  # [cooldowns], [class], [events], [timers] - belongs to that section of the
  # scoreboard, which each player may hide in /settings (settings.yml,
  # "scoreboard-<section>"). Tag a row as you like; an untagged row always shows.
  lines:
    - "{dark}▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪"
    - "[team]{primary}Team {dark}{bullet} {secondary}%team%"
    - "[team]{primary}DTR {dark}{bullet} %dtr_coloured%"
    - "[stats]{primary}Kills {dark}{bullet} {secondary}%kills%"
    - "[stats]{primary}Streak {dark}{bullet} {secondary}%killstreak%"
    - "[balance]{primary}Balance {dark}{bullet} {success}%balance%"
    - "[team]%focus_line%"
    - "[team]%rally_line%"
    - "[combat]%combat_line%"
    - "[cooldowns]%pearl_line%"
    - "[cooldowns]%cooldown_notch-apple_line%"
    - "[cooldowns]%cooldown_golden-apple_line%"
    - "[cooldowns]%cooldown_chorus-fruit_line%"
    - "[cooldowns]%cooldown_totem_line%"
    - "[class]%class_line%"
    - "[class]%class_energy_line%"
    - "[class]%archer_tag_line%"
    - "[events]%phase_line%"
    - "[events]%event_line%"
    - "[events]%king_line%"
    - "[events]%king_location_line%"
    - "[events]%conquest_line%"
    - "[events]%conquest_zone_1%"
    - "[events]%conquest_zone_2%"
    - "[events]%conquest_zone_3%"
    - "[events]%conquest_zone_4%"
    - "[timers]%timer_1%"
    - "[timers]%timer_2%"
    - "[timers]%timer_3%"
    - "{dark}▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪"
    - "{muted}play.yourserver.net"
  # --8<-- [end:scoreboard-lines]
# --8<-- [end:scoreboard]

# --8<-- [start:tablist]
tablist:
  # Off by default: the vanilla player list is perfectly good, and a header nobody
  # asked for is the kind of thing an operator notices and has to go turn off.
  enabled: false
  header:
    - "{primary}&lHCF"
    - "{muted}Hardcore Factions"
  footer:
    - "{text}Online {dark}{bullet} {secondary}%online%"
    - "{muted}play.yourserver.net"
# --8<-- [end:tablist]
